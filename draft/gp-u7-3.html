<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>中點又是正三角形</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>
:root{
  --paper:#F5F2E8; --grid:rgba(46,90,136,.07); --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C;
  --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --s1:#2E5A88; --s2:#4A7C59; --s3:#A8701E; --s4:#7A4E8C; --s5:#2D7F86;
  --shape-fill:rgba(46,90,136,.05);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
    --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
    --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
    --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
    --shape-fill:rgba(130,173,220,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
  --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
  --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
  --shape-fill:rgba(130,173,220,.07);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:26px 40px}
header{margin-bottom:16px}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:600}
h1{font-family:var(--serif); font-size:clamp(28px,4.6vw,40px); margin:4px 0 6px; line-height:1.25; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:16px}
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:14px}
.stage{padding:8px}
#stage{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; user-select:none}
#stage:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:8px}
.shape{fill:var(--shape-fill); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.vlab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink-2)}
.plab{font-family:var(--math); font-style:italic; font-size:21px; fill:var(--ink); font-weight:600}
.foot{stroke-width:2.2; stroke-dasharray:6 4}
.ext{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 5; fill:none}
.pdot{fill:var(--orange); stroke:var(--card); stroke-width:3}
.hint{font-size:13px; color:var(--ink-3); margin:4px 6px 0}
.rows{display:grid; gap:8px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:17px}
.sw{width:12px; height:12px; border-radius:3px}
.row .val{font-family:var(--math); font-size:26px; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
.row .val.neg{color:var(--crimson)}
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--edge)}
.sum .k{font-size:17px; font-weight:600}
.sum .v{font-family:var(--math); font-size:clamp(46px,7vw,64px); line-height:1; color:var(--orange);
  font-variant-numeric:tabular-nums; font-weight:600}
.strip-wrap{margin-top:14px}
.strip-cap{font-size:13px; color:var(--ink-3); margin-bottom:4px}
#strip{width:100%; height:auto; display:block}
.tick{font-family:var(--math); font-size:12px; fill:var(--ink-3)}
.controls{display:grid; gap:12px; margin-top:14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:8px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{font:inherit; font-size:14px; padding:7px 12px; border:0; border-right:1px solid var(--edge-soft);
  background:var(--card); color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#161A1E} }
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:inherit; font-size:15px; padding:8px 14px; border-radius:8px; border:1px solid var(--edge);
  background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{border-color:var(--orange); color:var(--orange); font-weight:600}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.check{display:flex; gap:8px; align-items:center; font-size:15px; color:var(--ink-2); cursor:pointer}
.stat{font-size:15px; color:var(--ink-2); min-height:1.6em}
.stat b{font-family:var(--math); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.same{color:var(--green)}
.stat.same b{color:var(--green)}
details{border-top:1px dashed var(--edge); padding-top:10px}
summary{cursor:pointer; font-size:13px; color:var(--ink-3)}
details .btns{margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.btn[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
:root[data-theme="dark"] .btn[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn[aria-pressed="true"]{color:#161A1E} }
.q{font-size:15px; color:var(--indigo); margin:4px 0 0; font-weight:600}
.lab{font-family:var(--math); font-style:italic; font-size:19px; fill:var(--ink)}
.lab2{font-family:var(--math); font-style:italic; font-size:17px; font-weight:600}
.drag{fill:var(--orange); stroke:var(--card); stroke-width:3; cursor:grab}
.hit{fill:transparent; cursor:grab}
.gridl{stroke:var(--edge-soft); stroke-width:1}
.kk{display:grid; grid-template-columns:auto 1fr 4.5ch; gap:10px; align-items:center; font-size:15px; color:var(--ink-2)}
.kk input{width:100%}
.kk output{font-family:var(--math); font-size:17px; text-align:right; color:var(--ink)}
</style>

<style>
.t1{fill:rgba(46,90,136,.14); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.t2{fill:rgba(193,101,47,.16); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.t2g{fill:rgba(193,101,47,.10); stroke:var(--orange); stroke-width:1.8; stroke-dasharray:5 4}
.mid{fill:none; stroke:var(--orange); stroke-width:2.6; stroke-linejoin:round}
.con{stroke:var(--ink-3); stroke-width:1.1; stroke-dasharray:3 5}
.gl{stroke:var(--green); stroke-width:2}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元七　第 3 節</div>
    <h1>中點又是正三角形</h1>
    <p class="lede">兩個正三角形 <i>ABC</i>、<i>PQR</i>，對應頂點連起來取中點 <i>D</i>、<i>E</i>、<i>F</i>。兩個三角形放在哪裡都可以。</p>
  </header>
  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 400" role="img" aria-label="兩個三角形與對應頂點的中點" tabindex="0"></svg>
      <p class="hint">橘色的點可以拖：<i>A</i>、<i>B</i>、<i>P</i>、<i>Q</i>。單位 mm；預設和學習單第 1 頁一樣。</p>
    </div>
    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>DE</i>　<i>EF</i>　<i>FD</i></span><span class="val" id="v1" style="font-size:20px"></span></div>
        <div class="row" id="rowS" hidden><span class="sw" style="background:var(--ink)"></span><span>三邊比<br><small style="color:var(--ink-3)"><i>ABC</i>　│　<i>DEF</i></small></span><span class="val" id="v2" style="font-size:16px;white-space:nowrap"></span></div>
      </div>
      <div class="sum"><span class="k" id="sk">最長減最短</span><span class="v" id="vd" style="font-size:clamp(34px,5vw,48px)"></span></div>
      <div class="controls">
        <label class="kk"><span>從 <i>ABC</i> 走向 <i>PQR</i></span><input type="range" id="t" min="0" max="1" step="0.01" value="0.5"><output id="tv">½</output></label>
        <div class="btns">
          <button type="button" class="btn" id="flip" aria-pressed="false">把 <i>PQR</i> 翻面</button>
          <button type="button" class="btn" id="sim" aria-pressed="false">換成相似</button>
        </div>
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機放 1000 對</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千對。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns"><button type="button" class="btn" id="mv" aria-pressed="false">搬到共用一點</button></div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const HOME=()=>({A:[4,6],B:[34,6],P:[52,4],Q:[52,20]});
  let s=HOME(), flip=false, sim=false, mv=false, t=0.5, drag=null, running=false;
  let view={k:6,ox:30,oy:360};
  const X=(p)=>[view.ox+p[0]*view.k, view.oy-p[1]*view.k], Wd=(q)=>[(q[0]-view.ox)/view.k,(view.oy-q[1])/view.k];
  function fit(){ const T=pts(s), v=[T.A[0]-T.P[0],T.A[1]-T.P[1]]; let ps=[T.A,T.B,T.C,T.P,T.Q,T.R];
    if(mv) ps=ps.concat([[T.Q[0]+v[0],T.Q[1]+v[1]],[T.R[0]+v[0],T.R[1]+v[1]]]);
    const xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]), w=Math.max(...xs)-Math.min(...xs)||1, h=Math.max(...ys)-Math.min(...ys)||1;
    const k=Math.min(7, 370/w, 330/h); view={k, ox:220-k*(Math.max(...xs)+Math.min(...xs))/2, oy:200+k*(Math.max(...ys)+Math.min(...ys))/2}; }
  const mul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const E60=[0.5,Math.sqrt(3)/2];
  // 相似：C = A + (B−A)(1 + i·tan30°)，30°–60°–90° 三角形（直角在 B）
  function shapeK(f){ if(sim) return f?[1,-Math.tan(Math.PI/6)]:[1,Math.tan(Math.PI/6)]; return f?[0.5,-Math.sqrt(3)/2]:E60; }
  function third(a,b,f){ return add(a,mul(sub(b,a),shapeK(f))); }
  function pts(st){ const C=third(st.A,st.B,false), R=third(st.P,st.Q,flip); return {A:st.A,B:st.B,C,P:st.P,Q:st.Q,R}; }
  const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(p,tx,cls,fill,dx,dy){const q=X(p);const e=el("text",{x:q[0]+(dx||0),y:q[1]+(dy||0),class:cls,"text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=tx;return e;}
  const pg=(ps,cls)=>el("polygon",{points:ps.map(p=>X(p).join(",")).join(" "),class:cls});
  function ln(a,b,cls){const p=X(a),q=X(b);el("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls});}
  function lab(p,c,tx){const v=sub(p,c),L=Math.hypot(...v)||1;txt(p,tx,"lab",null,v[0]/L*18,-v[1]/L*18);}
  function draw(){
    svg.innerHTML=""; const T=pts(s);
    const D=lerp(T.A,T.P,t), E=lerp(T.B,T.Q,t), F=lerp(T.C,T.R,t);
    if(mv){ const v=sub(T.A,T.P), Q2=add(T.Q,v), R2=add(T.R,v); pg([T.A,Q2,R2],"t2g");
      ln(T.B,Q2,"con"); ln(T.C,R2,"con"); const E2=lerp(T.B,Q2,t), F2=lerp(T.C,R2,t);
      ln(T.A,E2,"gl"); ln(T.A,F2,"gl"); [E2,F2].forEach((m,i)=>{const q=X(m);el("circle",{cx:q[0],cy:q[1],r:4.5,fill:"var(--green)"});txt(m,i?"F′":"E′","lab2","var(--green)",14,-10);});
      txt(Q2,"Q′","lab2","var(--orange)",14,0); txt(R2,"R′","lab2","var(--orange)",-14,0); }
    ln(T.A,T.P,"con"); ln(T.B,T.Q,"con"); ln(T.C,T.R,"con");
    pg([T.A,T.B,T.C],"t1"); pg([T.P,T.Q,T.R],"t2"); pg([D,E,F],"mid");
    const G1=[(T.A[0]+T.B[0]+T.C[0])/3,(T.A[1]+T.B[1]+T.C[1])/3], G2=[(T.P[0]+T.Q[0]+T.R[0])/3,(T.P[1]+T.Q[1]+T.R[1])/3];
    lab(T.A,G1,"A");lab(T.B,G1,"B");lab(T.C,G1,"C");lab(T.P,G2,"P");lab(T.Q,G2,"Q");lab(T.R,G2,"R");
    [[D,"D"],[E,"E"],[F,"F"]].forEach(([m,tx])=>{const q=X(m);el("circle",{cx:q[0],cy:q[1],r:4.5,fill:"var(--orange)"});txt(m,tx,"lab2","var(--orange)",12,12);});
    ["A","B","P","Q"].forEach(h=>{const q=X(s[h]);el("circle",{cx:q[0],cy:q[1],r:18,class:"hit","data-h":h});el("circle",{cx:q[0],cy:q[1],r:7,class:"drag","data-h":h});});
    const d=[dist(D,E),dist(E,F),dist(F,D)];
    $("v1").textContent=d.map(x=>x.toFixed(1)).join("　");
    if(sim){ const a=[dist(T.A,T.B),dist(T.B,T.C),dist(T.C,T.A)]; const n=(arr)=>arr.map(x=>(x/arr[0]).toFixed(2)).join(":");
      $("rowS").hidden=false; $("v2").textContent=n(a)+"　│　"+(d[0]>1e-9?n(d):"—"); $("sk").textContent="比例最多差";
      const g=d[0]>1e-9?Math.max(...d.map((x,i)=>Math.abs(x/d[0]-a[i]/a[0]))):0; $("vd").textContent=g<0.0005?"0.000":g.toFixed(3); }
    else { $("rowS").hidden=true; $("sk").textContent="最長減最短"; const g=Math.max(...d)-Math.min(...d); $("vd").textContent=g<0.005?"0.00":g.toFixed(2); }
    $("tv").textContent=Math.abs(t-0.5)<1e-9?"½":t.toFixed(2);
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",(ev)=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h");if(!h||running)return;drag=h;svg.setPointerCapture(ev.pointerId);ev.preventDefault();});
  svg.addEventListener("pointermove",(ev)=>{if(!drag)return;const w=Wd(svgPt(ev));const p=[Math.round(w[0]*2)/2,Math.round(w[1]*2)/2];
    const o={...s,[drag]:p}; if(dist(o.A,o.B)<3&&dist(o.P,o.Q)<0.01&&drag!=="P"&&drag!=="Q") return; s=o; clearStat(); draw();});
  const end=()=>{if(drag){drag=null;fit();draw();}};svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));clearStat();fit();draw();});}
  tog("flip",()=>flip=!flip); tog("sim",()=>sim=!sim); tog("mv",()=>mv=!mv);
  $("t").addEventListener("input",()=>{t=+$("t").value;clearStat();draw();});
  $("home").addEventListener("click",()=>{if(running)return;s=HOME();t=0.5;$("t").value=0.5;clearStat();fit();draw();});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), N=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, stp=reduce?N:25;
    let done=0, worst=0;
    function tick(){
      for(let i=0;i<stp&&done<N;i++){ const r=()=>[Math.random()*55,Math.random()*45+3]; const st={A:r(),B:r(),P:r(),Q:r()};
        if(dist(st.A,st.B)<4||dist(st.P,st.Q)<2) continue; const T=pts(st);
        const D=lerp(T.A,T.P,t),E=lerp(T.B,T.Q,t),F=lerp(T.C,T.R,t); const d=[dist(D,E),dist(E,F),dist(F,D)];
        if(d[0]<1e-6) continue;
        let g; if(sim){const a=[dist(T.A,T.B),dist(T.B,T.C),dist(T.C,T.A)]; g=Math.max(...d.map((x,j)=>Math.abs(x/d[0]-a[j]/a[0])));} else g=Math.max(...d)-Math.min(...d);
        worst=Math.max(worst,g); s=st; done++; }
      fit(); draw(); $("stat").innerHTML=`放了 <b>${done}</b> 對`;
      if(done<N) requestAnimationFrame(tick);
      else{ running=false; $("run").disabled=false; s=keep; fit(); draw(); $("stat").innerHTML=`${done} 對：${sim?"比例":"三段"}最多差 <b>${worst<1e-6?"＜ 0.000001":worst.toFixed(3)}</b>`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  fit(); draw();
})();
</script>

</body></html>
