<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>又交在一點</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>
:root{
  --paper:#F5F2E8; --grid:rgba(46,90,136,.07); --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C;
  --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --s1:#2E5A88; --s2:#4A7C59; --s3:#A8701E; --s4:#7A4E8C; --s5:#2D7F86;
  --shape-fill:rgba(46,90,136,.05);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
    --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
    --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
    --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
    --shape-fill:rgba(130,173,220,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
  --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
  --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
  --shape-fill:rgba(130,173,220,.07);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:26px 40px}
header{margin-bottom:16px}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:600}
h1{font-family:var(--serif); font-size:clamp(28px,4.6vw,40px); margin:4px 0 6px; line-height:1.25; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:16px}
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:14px}
.stage{padding:8px}
#stage{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; user-select:none}
#stage:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:8px}
.shape{fill:var(--shape-fill); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.vlab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink-2)}
.plab{font-family:var(--math); font-style:italic; font-size:21px; fill:var(--ink); font-weight:600}
.foot{stroke-width:2.2; stroke-dasharray:6 4}
.ext{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 5; fill:none}
.pdot{fill:var(--orange); stroke:var(--card); stroke-width:3}
.hint{font-size:13px; color:var(--ink-3); margin:4px 6px 0}
.rows{display:grid; gap:8px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:17px}
.sw{width:12px; height:12px; border-radius:3px}
.row .val{font-family:var(--math); font-size:26px; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
.row .val.neg{color:var(--crimson)}
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--edge)}
.sum .k{font-size:17px; font-weight:600}
.sum .v{font-family:var(--math); font-size:clamp(46px,7vw,64px); line-height:1; color:var(--orange);
  font-variant-numeric:tabular-nums; font-weight:600}
.strip-wrap{margin-top:14px}
.strip-cap{font-size:13px; color:var(--ink-3); margin-bottom:4px}
#strip{width:100%; height:auto; display:block}
.tick{font-family:var(--math); font-size:12px; fill:var(--ink-3)}
.controls{display:grid; gap:12px; margin-top:14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:8px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{font:inherit; font-size:14px; padding:7px 12px; border:0; border-right:1px solid var(--edge-soft);
  background:var(--card); color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#161A1E} }
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:inherit; font-size:15px; padding:8px 14px; border-radius:8px; border:1px solid var(--edge);
  background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{border-color:var(--orange); color:var(--orange); font-weight:600}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.check{display:flex; gap:8px; align-items:center; font-size:15px; color:var(--ink-2); cursor:pointer}
.stat{font-size:15px; color:var(--ink-2); min-height:1.6em}
.stat b{font-family:var(--math); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.same{color:var(--green)}
.stat.same b{color:var(--green)}
details{border-top:1px dashed var(--edge); padding-top:10px}
summary{cursor:pointer; font-size:13px; color:var(--ink-3)}
details .btns{margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.side{stroke:var(--ink); stroke-width:2.2; fill:var(--shape-fill); stroke-linejoin:round}
.extl{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 5}
.cev{stroke:var(--indigo); stroke-width:2}
.inc{stroke:var(--ink-3); stroke-width:1.4; fill:none}
.foot{fill:var(--indigo)}
.meet{fill:var(--orange)}
.lab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink)}
.lab2{font-family:var(--math); font-style:italic; font-size:17px; fill:var(--ink-2)}
.drag{fill:var(--orange); stroke:var(--card); stroke-width:3; cursor:grab}
.hit{fill:transparent; cursor:grab}
.q{font-size:15px; color:var(--indigo); margin:4px 0 0; font-weight:600}
.where{font-size:15px; color:var(--ink-2)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元四　第 1 節</div>
    <h1>又交在一點</h1>
    <p class="lede">從三個頂點各畫一條線。換一組畫法、拖動三角形，看三條線怎麼走。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 380" role="img" aria-label="可拖動頂點的三角形與三條線" tabindex="0"></svg>
      <p class="hint">拖動橘色的頂點 <i>A</i>、<i>B</i>、<i>C</i>。單位 mm；預設和學習單第 1 頁一樣：<i>BC</i> ＝ 80、<i>CA</i> ＝ 70、<i>AB</i> ＝ 90。</p>
    </div>

    <div class="panel">
      <div class="seg" role="group" aria-label="畫哪一組線">
        <button type="button" data-f="med" aria-pressed="false">中線</button>
        <button type="button" data-f="bis" aria-pressed="false">角平分線</button>
        <button type="button" data-f="alt" aria-pressed="false">高</button>
        <button type="button" data-f="ger" aria-pressed="true">連到切點</button>
      </div>
      <div class="rows" style="margin-top:12px">
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span>交點在三角形</span><span class="val" id="vIn" style="font-size:20px"></span></div>
      </div>
      <div class="sum"><span class="k">兩兩交點最遠相距（mm）</span><span class="v" id="vGap" style="font-size:clamp(30px,5vw,44px)"></span></div>
      <div class="rows" id="ratios" hidden style="margin-top:10px">
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>AF</i> ÷ <i>FB</i></span><span class="val" id="r1"></span></div>
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>BD</i> ÷ <i>DC</i></span><span class="val" id="r2"></span></div>
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>CE</i> ÷ <i>EA</i></span><span class="val" id="r3"></span></div>
        <div class="row" id="prodRow" hidden><span class="sw" style="background:var(--orange)"></span><span><b>三個乘起來</b></span><span class="val" id="r4" style="color:var(--orange)"></span></div>
      </div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 個三角形</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>一千個三角形都交在一點。第一千零一個呢？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="showR" aria-pressed="false">顯示三個比</button>
            <button type="button" class="btn" id="showP" aria-pressed="false">乘起來</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const AX = (8100 - 4900 + 6400) / 160;
  const HOME = { A: [AX, Math.sqrt(8100 - AX*AX)], B: [0, 0], C: [80, 0] };
  let s = JSON.parse(JSON.stringify(HOME)), fam = "ger", showR = false, showP = false, running = false, drag = null;
  const K = 3.6, O = [76, 320];
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function foot(P, U, V){ const ux = V[0]-U[0], uy = V[1]-U[1], t = ((P[0]-U[0])*ux + (P[1]-U[1])*uy) / (ux*ux + uy*uy); return [U[0]+t*ux, U[1]+t*uy]; }
  function inter(P1, P2, P3, P4){ const d = (P1[0]-P2[0])*(P3[1]-P4[1]) - (P1[1]-P2[1])*(P3[0]-P4[0]); if (Math.abs(d) < 1e-12) return null;
    const t = ((P1[0]-P3[0])*(P3[1]-P4[1]) - (P1[1]-P3[1])*(P3[0]-P4[0])) / d; return [P1[0]+t*(P2[0]-P1[0]), P1[1]+t*(P2[1]-P1[1])]; }
  // 有向比 PX/XQ
  function sr(P, Xp, Q){ const v = [Q[0]-P[0], Q[1]-P[1]], t = ((Xp[0]-P[0])*v[0] + (Xp[1]-P[1])*v[1]) / (v[0]*v[0] + v[1]*v[1]); return t / (1 - t); }
  function feet(A, B, C, f){
    const a = dist(B, C), b = dist(C, A), c = dist(A, B), sp = (a + b + c) / 2;
    if (f === "med") return [lerp(B, C, .5), lerp(C, A, .5), lerp(A, B, .5)];
    if (f === "bis") return [lerp(B, C, c/(b+c)), lerp(C, A, a/(a+c)), lerp(A, B, b/(a+b))];
    if (f === "alt") return [foot(A, B, C), foot(B, C, A), foot(C, A, B)];
    return [lerp(B, C, (sp-b)/a), lerp(C, A, (sp-c)/b), lerp(A, B, (sp-a)/c)];
  }
  function measure(A, B, C, f){
    const [D, E, F] = feet(A, B, C, f);
    const p1 = inter(A, D, B, E), p2 = inter(B, E, C, F), p3 = inter(C, F, A, D);
    if (!p1 || !p2 || !p3) return null;
    const gap = Math.max(dist(p1, p2), dist(p2, p3), dist(p3, p1));
    const M = [(p1[0]+p2[0]+p3[0])/3, (p1[1]+p2[1]+p3[1])/3];
    const sg = Math.sign(cross(A, B, C)), inside = [cross(A, B, M), cross(B, C, M), cross(C, A, M)].every(v => v * sg > 0);
    return { D, E, F, M, gap, inside };
  }
  const fmtGap = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(2));

  function draw(){
    svg.innerHTML = "";
    const { A, B, C } = s, m = measure(A, B, C, fam);
    const a = dist(B, C), b = dist(C, A), c = dist(A, B), sp = (a + b + c) / 2;
    if (fam === "ger"){ const I = [(a*A[0] + b*B[0] + c*C[0]) / (a+b+c), (a*A[1] + b*B[1] + c*C[1]) / (a+b+c)];
      const r = Math.abs(cross(A, B, C)) / 2 / sp, q = X(I); el("circle", { cx: q[0], cy: q[1], r: r*K, class: "inc" }); }
    const pa = X(A), pb = X(B), pc = X(C);
    el("polygon", { points: [pa, pb, pc].map(p => p.join(",")).join(" "), class: "side" });
    if (m){
      // 垂足落在延長線上：把那一邊延長畫虛線
      [[B, C, m.D], [C, A, m.E], [A, B, m.F]].forEach(([U, V, Q]) => { const t = sr(U, Q, V); if (t < 0){
        const near = dist(Q, U) < dist(Q, V) ? U : V, pn = X(near), pq = X(Q); el("line", { x1: pn[0], y1: pn[1], x2: pq[0], y2: pq[1], class: "extl" }); } });
      // 三條線：畫出涵蓋頂點、垂足、交點的那一段
      [[A, m.D], [B, m.E], [C, m.F]].forEach(([V, Q]) => {
        const u = [Q[0]-V[0], Q[1]-V[1]], tt = [0, 1, ((m.M[0]-V[0])*u[0] + (m.M[1]-V[1])*u[1]) / (u[0]*u[0] + u[1]*u[1])];
        const p1 = X(lerp(V, Q, Math.min(...tt))), p2 = X(lerp(V, Q, Math.max(...tt)));
        el("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: "cev" });
      });
      [m.D, m.E, m.F].forEach(Q => { const q = X(Q); el("circle", { cx: q[0], cy: q[1], r: 3.6, class: "foot" }); });
      const mm = X(m.M); el("circle", { cx: mm[0], cy: mm[1], r: 5, class: "meet" });
      const Gc = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
      [["D", m.D], ["E", m.E], ["F", m.F]].forEach(([t, Q]) => { const v = [Q[0]-Gc[0], Q[1]-Gc[1]], L = Math.hypot(...v) || 1, q = X([Q[0] + v[0]/L*5, Q[1] + v[1]/L*5]); txt(q[0], q[1], t, "lab2"); });
      $("vGap").textContent = fmtGap(m.gap); $("vIn").textContent = m.inside ? "裡面" : "外面";
      if (showR){ const r1 = dist(A, m.F)/dist(m.F, B), r2 = dist(B, m.D)/dist(m.D, C), r3 = dist(C, m.E)/dist(m.E, A);
        $("r1").textContent = r1.toFixed(3); $("r2").textContent = r2.toFixed(3); $("r3").textContent = r3.toFixed(3); $("r4").textContent = (r1*r2*r3).toFixed(3); }
    }
    const Gc = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
    [["A", A], ["B", B], ["C", C]].forEach(([t, V]) => { const v = [V[0]-Gc[0], V[1]-Gc[1]], L = Math.hypot(...v) || 1, q = X([V[0] + v[0]/L*6.5, V[1] + v[1]/L*6.5]); txt(q[0], q[1], t, "lab"); });
    [["A", pa], ["B", pb], ["C", pc]].forEach(([id, p]) => { el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": id }); });
    $("ratios").hidden = !showR; $("prodRow").hidden = !showP;
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev)); const t = { ...s, [drag]: w };
    if (Math.abs(cross(t.A, t.B, t.C)) < 40) return; s[drag] = w; clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { if (running) return; fam = b.dataset.f;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); clearStat(); draw(); }));
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("showR").addEventListener("click", () => { showR = !showR; if (!showR) showP = false; $("showR").setAttribute("aria-pressed", String(showR)); $("showP").setAttribute("aria-pressed", String(showP)); draw(); });
  $("showP").addEventListener("click", () => { showP = !showP; if (showP) showR = true; $("showR").setAttribute("aria-pressed", String(showR)); $("showP").setAttribute("aria-pressed", String(showP)); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0, out = 0;
    const rnd = () => [-10 + Math.random()*110, -5 + Math.random()*85];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        let T; do { T = { A: rnd(), B: rnd(), C: rnd() }; } while (Math.abs(cross(T.A, T.B, T.C)) < 300);
        const m = measure(T.A, T.B, T.C, fam); if (!m) continue; done++; worst = Math.max(worst, m.gap); if (!m.inside) out++; s = T;
      }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 個三角形`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 個三角形，兩兩交點最遠相距 <b>${fmtGap(worst)}</b> mm；交點在三角形外面 <b>${out}</b> 次`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.A = [s.A[0] + mv[0], s.A[1] + mv[1]]; draw(); });
  draw();
})();
</script>
