<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>對角線乘起來</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>
:root{
  --paper:#F5F2E8; --grid:rgba(46,90,136,.07); --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C;
  --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --s1:#2E5A88; --s2:#4A7C59; --s3:#A8701E; --s4:#7A4E8C; --s5:#2D7F86;
  --shape-fill:rgba(46,90,136,.05);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
    --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
    --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
    --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
    --shape-fill:rgba(130,173,220,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
  --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
  --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
  --shape-fill:rgba(130,173,220,.07);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:26px 40px}
header{margin-bottom:16px}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:600}
h1{font-family:var(--serif); font-size:clamp(28px,4.6vw,40px); margin:4px 0 6px; line-height:1.25; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:16px}
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:14px}
.stage{padding:8px}
#stage{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; user-select:none}
#stage:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:8px}
.shape{fill:var(--shape-fill); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.vlab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink-2)}
.plab{font-family:var(--math); font-style:italic; font-size:21px; fill:var(--ink); font-weight:600}
.foot{stroke-width:2.2; stroke-dasharray:6 4}
.ext{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 5; fill:none}
.pdot{fill:var(--orange); stroke:var(--card); stroke-width:3}
.hint{font-size:13px; color:var(--ink-3); margin:4px 6px 0}
.rows{display:grid; gap:8px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:17px}
.sw{width:12px; height:12px; border-radius:3px}
.row .val{font-family:var(--math); font-size:26px; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
.row .val.neg{color:var(--crimson)}
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--edge)}
.sum .k{font-size:17px; font-weight:600}
.sum .v{font-family:var(--math); font-size:clamp(46px,7vw,64px); line-height:1; color:var(--orange);
  font-variant-numeric:tabular-nums; font-weight:600}
.strip-wrap{margin-top:14px}
.strip-cap{font-size:13px; color:var(--ink-3); margin-bottom:4px}
#strip{width:100%; height:auto; display:block}
.tick{font-family:var(--math); font-size:12px; fill:var(--ink-3)}
.controls{display:grid; gap:12px; margin-top:14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:8px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{font:inherit; font-size:14px; padding:7px 12px; border:0; border-right:1px solid var(--edge-soft);
  background:var(--card); color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#161A1E} }
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:inherit; font-size:15px; padding:8px 14px; border-radius:8px; border:1px solid var(--edge);
  background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{border-color:var(--orange); color:var(--orange); font-weight:600}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.check{display:flex; gap:8px; align-items:center; font-size:15px; color:var(--ink-2); cursor:pointer}
.stat{font-size:15px; color:var(--ink-2); min-height:1.6em}
.stat b{font-family:var(--math); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.same{color:var(--green)}
.stat.same b{color:var(--green)}
details{border-top:1px dashed var(--edge); padding-top:10px}
summary{cursor:pointer; font-size:13px; color:var(--ink-3)}
details .btns{margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.circ{stroke:var(--ink); stroke-width:2.2; fill:var(--shape-fill)}
.side{stroke:var(--ink); stroke-width:2.2; fill:none; stroke-linejoin:round}
.dg{stroke:var(--indigo); stroke-width:1.6}
.kc{stroke:var(--orange); stroke-width:1.2; stroke-dasharray:4 4; fill:none}
.img{stroke:var(--orange); stroke-width:2}
.ray{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 5}
.lab{font-family:var(--math); font-style:italic; font-size:19px; fill:var(--ink)}
.lab2{font-family:var(--math); font-style:italic; font-size:17px; font-weight:600}
.drag{fill:var(--orange); stroke:var(--card); stroke-width:3; cursor:grab}
.hit{fill:transparent; cursor:grab}
.btn[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
:root[data-theme="dark"] .btn[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn[aria-pressed="true"]{color:#161A1E} }
.q{font-size:15px; color:var(--indigo); margin:4px 0 0; font-weight:600}
.kk{display:flex; gap:10px; align-items:center; font-size:15px; color:var(--ink-2)}
.kk input{flex:1; max-width:220px}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元六　第 4 節</div>
    <h1>對角線乘起來</h1>
    <p class="lede">四個點依序在圓上。兩組對邊各自乘起來再相加，和兩條對角線乘起來，比一比。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 420" role="img" aria-label="圓上四點與四邊形" tabindex="0"></svg>
      <p class="hint">橘色的點沿著圓拖。單位 mm；直徑 65，預設和學習單第 1 頁一樣。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--ink)"></span><span><i>AB</i>·<i>CD</i> ＋ <i>AD</i>·<i>BC</i></span><span class="val" id="vL"></span></div>
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>AC</i>·<i>BD</i></span><span class="val" id="vR"></span></div>
        <div class="row" id="rowI" hidden><span class="sw" style="background:var(--orange)"></span><span><i>B</i>′<i>C</i>′ ＋ <i>C</i>′<i>D</i>′　│　<i>B</i>′<i>D</i>′</span><span class="val" id="vI" style="font-size:19px"></span></div>
      </div>
      <div class="sum"><span class="k">相差</span><span class="v" id="vd" style="font-size:clamp(34px,5vw,48px)"></span></div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 組點</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="btns">
          <button type="button" class="btn" id="free" aria-pressed="false">讓 <i>D</i> 離開圓</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千組點。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="inv" aria-pressed="false">從 <i>A</i> 翻過去</button>
          </div>
          <label class="kk" id="kbox" hidden><i>k</i><input type="range" id="k" min="20" max="80" step="1" value="32"><span id="kv">32</span></label>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R = 32.5, K = 4.4, O0 = [190, 215];
  const ang = (c) => 2*Math.asin(c/65), a0 = 215*Math.PI/180;
  const on = (t) => [R*Math.cos(t), R*Math.sin(t)];
  const HOME = () => { const t = [a0, a0 + ang(25), a0 + ang(25) + ang(39), a0 + ang(25) + ang(39) + ang(60)]; return { A: on(t[0]), B: on(t[1]), C: on(t[2]), D: on(t[3]) }; };
  let s = HOME(), free = false, inv = false, k = 32, running = false, drag = null;
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const kk in a) e.setAttribute(kk, a[kk]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  function line(P, Q, cls){ const a = X(P), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function dot(P, c, r){ const q = X(P); el("circle", { cx: q[0], cy: q[1], r: r || 4.2, fill: c }); }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const val = (q) => ({ L: dist(q.A, q.B)*dist(q.C, q.D) + dist(q.A, q.D)*dist(q.B, q.C), R: dist(q.A, q.C)*dist(q.B, q.D) });
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(3));
  function invP(P){ const v = [P[0]-s.A[0], P[1]-s.A[1]], L2 = v[0]*v[0] + v[1]*v[1]; return [s.A[0] + v[0]*k*k/L2, s.A[1] + v[1]*k*k/L2]; }
  function draw(){
    svg.innerHTML = "";
    const o = X([0, 0]); el("circle", { cx: o[0], cy: o[1], r: R*K, class: "circ" });
    if (inv){
      const a = X(s.A); el("circle", { cx: a[0], cy: a[1], r: k*K, class: "kc" });
      const u = [-s.A[0]/R, -s.A[1]/R], F = [s.A[0] + u[0]*k*k/(2*R), s.A[1] + u[1]*k*k/(2*R)], t = [-u[1], u[0]];
      line([F[0] - t[0]*120, F[1] - t[1]*120], [F[0] + t[0]*120, F[1] + t[1]*120], "img");
      ["B", "C", "D"].forEach((n) => { const Q = invP(s[n]), far = dist(s.A, Q) > dist(s.A, s[n]) ? Q : s[n]; line(s.A, far, "ray"); dot(Q, "var(--orange)", 4); const q = X(Q); txt(q[0] + 16, q[1] - 10, n + "′", "lab2", "var(--orange)"); });
      const Bp = invP(s.B), Cp = invP(s.C), Dp = invP(s.D);
      $("vI").textContent = (dist(Bp, Cp) + dist(Cp, Dp)).toFixed(2) + "　│　" + dist(Bp, Dp).toFixed(2);
    }
    el("polygon", { points: [s.A, s.B, s.C, s.D].map(p => X(p).join(",")).join(" "), class: "side" });
    line(s.A, s.C, "dg"); line(s.B, s.D, "dg");
    ["A", "B", "C", "D"].forEach((n) => { const V = s[n], L = Math.hypot(...V) || 1, q = X([V[0]*(1 + 7/L), V[1]*(1 + 7/L)]); txt(q[0], q[1], n, "lab");
      const p = X(V); el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": n }); el("circle", { cx: p[0], cy: p[1], r: 7.5, class: "drag", "data-h": n }); });
    const v = val(s); $("vL").textContent = v.L.toFixed(1); $("vR").textContent = v.R.toFixed(1); $("vd").textContent = (Math.abs(v.L - v.R) < 0.005 ? 0 : v.L - v.R).toFixed(2);
    $("rowI").hidden = !inv;
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  const angOf = (p) => { let t = Math.atan2(p[1], p[0]) - a0; while (t < 0) t += 2*Math.PI; return t; };
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    let p; if (drag === "D" && free){ if (Math.hypot(...w) > 46) return; p = w; } else { const t = Math.atan2(w[1], w[0]); p = on(t); }
    const t2 = { ...s, [drag]: p };
    if (!(drag === "D" && free)){ const order = ["A", "B", "C", "D"].map(n => n === "D" && free ? null : angOf(t2[n]) ); const seq = order.filter(x => x !== null); for (let i = 1; i < seq.length; i++) if (seq[i] <= seq[i-1] + 0.03) return; }
    s = t2; clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("free", () => { free = !free; if (!free){ const t = Math.atan2(s.D[1], s.D[0]); s.D = on(t); } clearStat(); return free; });
  tog("inv", () => { inv = !inv; $("kbox").hidden = !inv; return inv; });
  $("k").addEventListener("input", () => { k = +$("k").value; $("kv").textContent = k; draw(); });
  $("home").addEventListener("click", () => { if (running) return; s = HOME(); clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0;
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const t = [0, 1, 2, 3].map(() => Math.random()*2*Math.PI).sort((x, y) => x - y);
        const q = { A: on(t[0]), B: on(t[1]), C: on(t[2]), D: free ? s.D : on(t[3]) }; if (free){ continue; }
        s = q; const v = val(q); worst = Math.max(worst, Math.abs(v.L - v.R)); done++;
      }
      if (free){ running = false; $("run").disabled = false; $("stat").textContent = "先把「讓 D 離開圓」關掉。"; return; }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 組點`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 組點：兩個數最多差 <b>${fmt(worst)}</b>`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>

</body></html>
