<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>/* layout: full-bleed map, floating header card top-left, drawer right (bottom sheet on phones) */
:root{
  --sea:#c3e4e6; --sea-deep:#94cbd0; --ink:#1d3a40; --ink-soft:#4f6a6e; --paper:#f6f8f4;
  --sand:#e7dcc0; --land:#8fbf78; --land-hi:#b4d68e; --accent:#c4572e; --route:#2f6f86; --fog:#7d9599;
  --card:#ffffffee; --line:#1d3a4022;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f2a33; --sea-deep:#0a1f27; --ink:#e3eeec; --ink-soft:#9fb7b8; --paper:#132830;
  --sand:#7d7356; --land:#4f6d4c; --land-hi:#62845c; --accent:#e58a5f; --route:#7fc3d8; --fog:#58737a;
  --card:#152c34ee; --line:#e3eeec22; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f2a33; --sea-deep:#0a1f27; --ink:#e3eeec; --ink-soft:#9fb7b8; --paper:#132830;
  --sand:#7d7356; --land:#4f6d4c; --land-hi:#62845c; --accent:#e58a5f; --route:#7fc3d8; --fog:#58737a;
  --card:#152c34ee; --line:#e3eeec22; color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;z-index:5;max-width:calc(100% - 24px)}
.brand{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.brand h1{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;font-weight:700}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-soft)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink-soft);font:600 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.drawer button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink-soft);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.legend i.h{border-top:2px dashed var(--route)}
.legend i.lh{width:8px;height:8px;border:0;border-radius:50%;background:var(--accent)}
.drawer{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:340px;max-width:calc(100% - 24px);background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;
  z-index:6;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
.drawer[hidden]{display:none!important}
.drawer header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header .k{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.drawer header h2{margin:2px 0 0;font-family:var(--f-display);font-size:24px;line-height:1.2;text-wrap:balance}
.drawer header .x{margin-left:auto;border:0;background:none;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1}
.drawer .body{padding:12px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.65}
.tnote{border-left:3px solid var(--accent);padding:6px 10px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:13px;color:var(--ink)}
.tnote b{color:var(--accent)}
.sec{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.sec .n{font:700 12px var(--f-body);color:var(--paper);background:var(--ink);border-radius:6px;padding:2px 6px;margin-top:3px;font-variant-numeric:tabular-nums}
.sec h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700}
.sec .files{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-soft);background:none}
.chip.off{opacity:.7;border-style:dashed}
.sec button.go{all:unset;cursor:pointer}
.rt{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rt .lab{font-family:var(--f-display);font-size:17px}
.rt small{color:var(--ink-soft)}
.btn{align-self:flex-start;border:1px solid var(--ink);background:none;color:var(--ink);font:600 13px var(--f-body);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn.on{background:var(--ink);color:var(--paper)}
.muted{color:var(--ink-soft);font-size:13px}
.q{font-family:var(--f-display);font-size:19px;line-height:1.6}
.who{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:color-mix(in srgb,var(--sand) 35%,transparent);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit}
.person b{font-family:var(--f-display);font-size:16px}
.person span{font-size:11px;color:var(--ink-soft)}
.label.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:5px 10px;font:15px var(--f-display);white-space:nowrap;pointer-events:none;box-shadow:0 2px 0 var(--line);transition:opacity .4s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--paper);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pname{font:600 11px var(--f-body);color:var(--ink);background:color-mix(in srgb,var(--paper) 80%,transparent);border-radius:4px;padding:0 4px}
.label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-family:var(--f-display);color:var(--ink);text-shadow:0 0 4px var(--sea),0 0 8px var(--sea)}
.foot{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:calc(100% - 24px)}
@media (max-width:700px){
  .drawer{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-width:none;height:58%;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:19px}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

<script>// 幾何明珠群島：共用資料（2D 與 3D 兩版共用）
// 學生視角只看 student / 節次標題；教師視角才看 teacher / 航線標籤。
const COURSE = {
  islands: [
    { id: 1, num: '一', student: '不變島', teacher: '單元一　面積會加', core: '面積可加性：全課唯一的起手工具', chapters: '16、1 §1.2、5 §5.2',
      pos: [170, 190], r: 78, hue: 0,
      sections: [ ['1-1', '一個不會變的數'], ['1-2', '空白搬了家'], ['1-3', '三條線，交在一點'] ] },
    { id: 2, num: '二', student: '捷徑島', teacher: '單元二　把折線拉直', core: '變換首次登場：反射與旋轉是動作', chapters: '2、24',
      pos: [395, 120], r: 70,
      sections: [ ['2-1', '光走的那一條'], ['2-2', '最短的那一圈'], ['2-3', '三條路接成一條'] ] },
    { id: 3, num: '三', student: '比值群礁', teacher: '單元三　比的語言', core: '長度難比，改用比值；比值有乘法結構', chapters: '8、9、3 §3.1–3.2',
      pos: [610, 200], r: 64,
      sections: [ ['3-1', '離 A 是離 B 的兩倍'], ['3-2', '從頂點到底邊的那一條'], ['3-3', '切下來的那一塊'] ] },
    { id: 4, num: '四', student: '交會島', teacher: '單元四　乘積等於一', core: '三比值相乘為 1；正負號決定共線或共點', chapters: '4、5、10、23 §23.2',
      pos: [835, 150], r: 72,
      sections: [ ['4-1', '又交在一點'], ['4-2', '一條線穿過去'], ['4-3', '三組對邊，交在一條線上'] ] },
    { id: 5, num: '五', student: '九點島', teacher: '單元五　位似', core: '一個變換解釋一整串巧合', chapters: '11、15',
      pos: [870, 420], r: 70,
      sections: [ ['5-1', '三個點排成一列'], ['5-2', '九個點，一個圓'], ['5-3', '三個尖，一條線'] ] },
    { id: 6, num: '六', student: '雙圓島', teacher: '單元六　圓的冪', core: '新的守恆量：點對圓的冪與位置無關', chapters: '13、7、22、21',
      pos: [640, 500], r: 80,
      sections: [ ['6-1', '乘起來還是那個數'], ['6-2', '站在兩個圓中間'], ['6-3', '中點兩邊一樣長'], ['6-4', '對角線乘起來'] ] },
    { id: 7, num: '七', student: '迴旋島', teacher: '單元七　旋轉的合成', core: '兩旋轉合起來還是旋轉，接群論', chapters: '18、19、20（僅展示）',
      pos: [400, 470], r: 80,
      sections: [ ['7-1', '轉兩次'], ['7-2', '三個中心'], ['7-3', '中點又是正三角形'], ['7-4', '轉回原樣'] ] },
    { id: 8, num: '八', student: '無尺島', teacher: '單元八　丟掉長度', core: '拿掉度量之後還剩什麼', chapters: '23 §23.3、25、26',
      pos: [160, 450], r: 86,
      sections: [ ['8-1', '畫出來的地板'], ['8-2', '一個數都不用算'], ['8-3', '圓上六個點'], ['8-4', '翻譯過來的句子'], ['8-5', '最後一題'] ] },
  ],
  // 隱藏航線：同一招在不同島再出現。學生視角預設看不到，教師可逐條「揭開」。
  routes: [
    { id: 'r1', from: '1-3', to: '4-1', cls: '切三塊 → 繞一圈乘起來', acad: '面積法證塞瓦（塞瓦是載體）→ 塞瓦本身成為工具', note: '兩節的分工不可對調：命名事件在單元一第 3 節。' },
    { id: 'r2', from: '1-1', to: '2-3', cls: '一個不會變的數，又出現了', acad: '維維安尼 → 費馬點（解法 1 同時用維維安尼與拿破崙）', note: '書中第 16、18、24 章邏輯上是同一單元。' },
    { id: 'r3', from: '2-1', to: '2-3', cls: '這兩招是同一招嗎？', acad: '反射拉直兩段 vs 旋轉 60° 拉直三段', note: '目的相同、動作不同：適合做 ★★ 任務。' },
    { id: 'r4', from: '2-3', to: '7-1', cls: '轉出一個正三角形', acad: '旋轉 60° → 旋轉的合成（拿破崙）', note: '' },
    { id: 'r5', from: '1-1', to: '4-2', cls: '讓正負號管構型', acad: '有向線段：維維安尼 ★（P 跑到外面）→ 梅氏的正負號', note: '' },
    { id: 'r6', from: '4-3', to: '8-1', cls: '三組對邊，再訪', acad: '笛沙格 → 推廣到三維（證明比原定理還簡單）', note: '' },
    { id: 'r7', from: '6-1', to: '6-2', cls: '乘積不會變', acad: '圓冪 → 兩圓的冪相等（根軸）', note: '' },
  ],
  // 貫串線「驗證 vs 理解」：三座燈塔
  lighthouses: [
    { island: 1, angle: -40, q: '勾股定理已知的證法超過 400 種。當你有 400 個理由時，「證明」是在做什麼？', t: '單元一末' },
    { island: 4, angle: 30, q: '一個定理從提出到出現簡潔的證法，隔了 140 年。這 140 年裡，大家憑什麼相信它？', t: '單元四末：斯坦納–雷米歐司定理（§17.4 附反例）' },
    { island: 8, angle: 200, q: '算出 30° 和畫出那一條線，差在哪裡？', t: '單元八末：第 27 章 Langley 型難題' },
  ],
  // 島上的數學家。say＝頭上冒出的泡泡（短）；quote＝面板上的名言與出處；story＝學生可讀的數學史（不出現工具名）；teacher＝教師備註
  people: [
    { id: 'liuhui', island: 1, name: '劉徽', years: '三世紀・魏晉', place: '中國', look: { robe: '#3d5a80', hat: 'box', hatColor: '#222' },
      say: '析理以辭，解體用圖。', quote: '析理以辭，解體用圖。', src: '《九章算術注》序',
      story: '他替一本已經流傳幾百年的算書寫註解，常常不只說「怎麼算」，還畫圖說「為什麼對」。他喜歡把圖形拆開、搬一搬、再拼回去。', teacher: '出入相補原理，與單元一第 2 節的拼圖同源；可接東西方島。' },
    { id: 'viviani', island: 1, name: '維維安尼', years: '1622–1703', place: '義大利・佛羅倫斯', look: { robe: '#7a4b2a', hat: 'beret', hatColor: '#2b2b2b' },
      say: '我是伽利略最後的學生。', quote: '', src: '',
      story: '伽利略晚年失明，他當過伽利略的助手，後來寫了伽利略的第一本傳記。這座島上那個「不會變的數」，就以他命名。', teacher: '維維安尼定理（單元一第 1 節）。書中第 16 章。' },
    { id: 'heron', island: 2, name: '希羅', years: '約一世紀', place: '埃及・亞歷山卓', look: { robe: '#e0c36a', hat: 'none', hatColor: '#fff' },
      say: '光很懶，它挑最短的路走。', quote: '', src: '泡泡是改寫，不是原文',
      story: '他發明過自動門、蒸汽轉球，也寫過一本談鏡子的書。他注意到光從鏡子彈回來時，走的剛好是最短的那條路。', teacher: '《反射光學》。海倫最短路徑，單元二第 1 節。' },
    { id: 'fermat', island: 2, name: '費馬', years: '1607–1665', place: '法國・土魯斯', look: { robe: '#5b2a3c', hat: 'wig', hatColor: '#d9d2c3' },
      say: '這裡空白太小，寫不下。', quote: '我發現了一個真正奇妙的證明，可惜這裡的空白太小，寫不下。', src: '寫在丟番圖《算術》的頁邊（約 1637，大意）',
      story: '他的正職是法官，數學是業餘。他寫信問朋友：三角形裡哪一點到三個頂點的距離加起來最短？這封信難倒了不少人。', teacher: '費馬點（單元二第 3 節）。名言出自費馬最後定理，與本島無關，只是人物介紹。' },
    { id: 'euclid', island: 3, name: '歐幾里得', years: '約西元前 300 年', place: '埃及・亞歷山卓', look: { robe: '#f2efe6', hat: 'none', hatColor: '#fff' },
      say: '學幾何，沒有王者之路。', quote: '學幾何沒有王者之路。', src: '相傳是他回答國王的話（普羅克洛記載，真偽有爭議）',
      story: '他的《幾何原本》從幾條最簡單的規定出發，一步一步推出幾百個結果，是史上印刷次數數一數二多的書。', teacher: '' },
    { id: 'kepler', island: 3, name: '克卜勒', years: '1571–1630', place: '德國', look: { robe: '#2f4f4f', hat: 'tophat', hatColor: '#1a1a1a' },
      say: '幾何有兩大寶藏。', quote: '幾何學有兩大寶藏：一是畢氏定理，一是把線段分成中末比。前者可比黃金，後者可比珠寶。', src: '常見引述，出自他的著作（譯文為大意）',
      story: '他用了二十年對著觀測資料一直算，才發現行星的軌道不是圓，是橢圓。', teacher: '黃金分割（第 3 章 §3.1–3.2）。' },
    { id: 'ceva', island: 4, name: '塞瓦', years: '1647–1734', place: '義大利・曼托瓦', look: { robe: '#4a6fa5', hat: 'beret', hatColor: '#7a1f1f' },
      say: '六百年前就有人想過了？', quote: '', src: '',
      story: '1678 年他出了一本講直線的書。後來的人發現，書裡最有名的那個結果，早在十一世紀西班牙薩拉戈薩的一位國王兼數學家穆塔曼的書裡就證過了。', teacher: '塞瓦定理（單元四）。伊本・胡德（al-Mu’taman ibn Hud）早已證明，可做東西方航線。' },
    { id: 'menelaus', island: 4, name: '梅涅勞斯', years: '約 70–140', place: '亞歷山卓・羅馬', look: { robe: '#c9a96e', hat: 'none', hatColor: '#fff' },
      say: '我其實在算星星。', quote: '', src: '',
      story: '他研究的是畫在球面上的三角形，目的是為了天文。後來大家把他的結果搬回平面上用。', teacher: '梅氏定理，原在《球面學》。' },

const SECTION_INDEX = {};
COURSE.islands.forEach(isl => isl.sections.forEach(([id, title], i) => {

}));
function fileBase(sec) {

// 共用介面：視角切換、抽屜面板、航線揭開狀態
const UI = (() => {
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const state = { mode: store.get('gp-mode', 'student'), revealed: new Set(store.get('gp-revealed', [])), current: null };
  const subs = [];
  const emit = () => subs.forEach(f => f(state));
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const T = () => state.mode === 'teacher';

  function setMode(m) {
    state.mode = m; store.set('gp-mode', m);
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    $('#sub').textContent = T() ? '教師視角：單元名、隱藏航線、燈塔出處都會顯示' : '學生視角：點一座島，看看上面有什麼';
    emit(); if (state.current) open(state.current);
  }
  function toggleRoute(id) {
    state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id);
    store.set('gp-revealed', [...state.revealed]); emit(); if (state.current) open(state.current);
  }
  function visibleRoutes() { return COURSE.routes.filter(r => T() || state.revealed.has(r.id)); }

  function sectionHTML(id) {
    const s = SECTION_INDEX[id];
    return `<div class="sec"><span class="n">${s.island.num}-${id.split('-')[1]}</span>
      <div><h3>${esc(s.title)}</h3></div>
      <div class="files"><span class="chip off" title="${esc(fileBase(s))}_動態頁_離線.html">動態頁</span>
      <span class="chip off">學生版</span>${T() ? '<span class="chip off">教師版</span>' : ''}</div></div>`;
  }
  function routeHTML(r) {
    const a = SECTION_INDEX[r.from], b = SECTION_INDEX[r.to];
    const on = state.revealed.has(r.id);
    return `<div class="rt"><span class="lab">${esc(a.island.student)} ${a.island.num}-${r.from.split('-')[1]} ⇢ ${esc(b.island.student)} ${b.island.num}-${r.to.split('-')[1]}</span>
      ${T() ? `<small>課堂名：${esc(r.cls)}</small><small>教師備註：${esc(r.acad)}</small>${r.note ? `<small>${esc(r.note)}</small>` : ''}
      <button class="btn ${on ? 'on' : ''}" data-reveal="${r.id}">${on ? '已向學生揭開（再按收回）' : '向學生揭開這條航線'}</button>`
        : `<small>有人發現：這兩個地方用的是同一招。</small>`}</div>`;
  }

  function open(item) {
    state.current = item;
    const d = $('#drawer'); let k = '', h = '', body = '';
    if (item.type === 'island') {
      const isl = COURSE.islands.find(i => i.id === item.id);
      k = `第 ${isl.num} 島`; h = isl.student;
      if (T()) body += `<div class="tnote"><b>${esc(isl.teacher)}</b><br>${esc(isl.core)}<br><span class="muted">主要章次：${esc(isl.chapters)}</span></div>`;
      const ppl = COURSE.people.filter(p => p.island === isl.id);
      if (ppl.length) body += `<div class="who">${ppl.map(p => `<button class="person" data-person="${p.id}"><b>${esc(p.name)}</b><span>${esc(p.years)}</span></button>`).join('')}</div>`;
      body += isl.sections.map(([id]) => sectionHTML(id)).join('');
      const rs = visibleRoutes().filter(r => SECTION_INDEX[r.from].island === isl || SECTION_INDEX[r.to].island === isl);
      if (rs.length) body += `<div class="muted" style="margin-top:6px">從這座島出發的隱藏航線</div>` + rs.map(routeHTML).join('');
      else if (!T()) body += `<p class="muted">這座島和其他島之間，還沒有人發現新的航線。</p>`;
    } else if (item.type === 'route') {
      const r = COURSE.routes.find(x => x.id === item.id); k = '隱藏航線'; h = T() ? r.cls : '同一招，兩個地方';
      body = routeHTML(r);
    } else if (item.type === 'lighthouse') {
      const L = COURSE.lighthouses[item.idx]; k = '燈塔'; h = '驗證還是理解？';
      body = `<p class="q">${esc(L.q)}</p>` + (T() ? `<div class="tnote">${esc(L.t)}</div>` : '');
    } else if (item.type === 'person') {
      const P = COURSE.people.find(x => x.id === item.id); const isl = COURSE.islands.find(i => i.id === P.island);
      k = `${isl.student}的居民`; h = P.name;
      body = `<div class="muted">${esc(P.years)}・${esc(P.place)}</div>`;
      if (P.quote) body += `<p class="q">「${esc(P.quote)}」</p><div class="muted">— ${esc(P.src)}</div>`;
      body += `<p>${esc(P.story)}</p>`;
      if (T() && P.teacher) body += `<div class="tnote">${esc(P.teacher)}</div>`;
      body += `<button class="btn" data-isl="${isl.id}">去看${esc(isl.student)}</button>`;
    } else if (item.type === 'bottle') {
      k = '漂流瓶'; h = '牆上的謎'; body = `<p class="q">${esc(COURSE.bottle.q)}</p>` + (T() ? `<div class="tnote">${esc(COURSE.bottle.t)}</div>` : '');
    }
    d.innerHTML = `<header><div><div class="k">${esc(k)}</div><h2>${esc(h)}</h2></div><button class="x" aria-label="關閉">×</button></header><div class="body">${body}</div>`;
    d.hidden = false;
    d.querySelector('.x').onclick = close;
    d.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => toggleRoute(b.dataset.reveal));
    d.querySelectorAll('[data-person]').forEach(b => b.onclick = () => open({ type: 'person', id: b.dataset.person }));
    d.querySelectorAll('[data-isl]').forEach(b => b.onclick = () => open({ type: 'island', id: +b.dataset.isl }));
    emit();
  }
  function close() { state.current = null; $('#drawer').hidden = true; emit(); }

  function init() {
    document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    setMode(state.mode);
  }
  return { state, init, open, close, onChange: f => subs.push(f), visibleRoutes, isTeacher: T };
})();

  .hr{cursor:pointer} .hr:hover .vis{stroke-width:3.2}`;
  document.head.appendChild(style);

  function drawHidden() {
    layerHidden.innerHTML = '';
    UI.visibleRoutes().forEach(r => {
      const [x0, y0] = secPos[r.from], [x1, y1] = secPos[r.to];
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
      const bow = Math.min(90, len * 0.35) + 30;
      const cx = mx + (-dy / len) * bow, cy = my + (dx / len) * bow;
      const g = el('g', { class: 'hr', tabindex: 0, role: 'button', 'aria-label': '隱藏航線' }, layerHidden);
      const dd = `M${x0},${y0} Q${cx},${cy} ${x1},${y1}`;
      el('path', { d: dd, fill: 'none', stroke: 'transparent', 'stroke-width': 14 }, g);
      el('path', { d: dd, class: 'vis', fill: 'none', stroke: 'var(--route)', 'stroke-width': 2, 'stroke-dasharray': '4 5', 'stroke-linecap': 'round' }, g);
      const cur = UI.state.current; const near = cur && ((cur.type === 'route' && cur.id === r.id) || (cur.type === 'island' && (SECTION_INDEX[r.from].island.id === cur.id || SECTION_INDEX[r.to].island.id === cur.id)));
      if (UI.isTeacher() && near) {
        const t = el('text', { x: (mx + cx) / 2, y: (my + cy) / 2, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--route)', 'paint-order': 'stroke', stroke: 'var(--sea)', 'stroke-width': 4, 'font-family': 'var(--f-display)' }, g);
        t.textContent = r.cls + (UI.state.revealed.has(r.id) ? '' : '（未揭開）');
      }
      g.addEventListener('click', e => { e.stopPropagation(); if (!dragged) UI.open({ type: 'route', id: r.id }); });
    });
    COURSE.islands.forEach(isl => isl._tlab.style.display = UI.isTeacher() ? '' : 'none');
  }
  UI.onChange(drawHidden);

  // mathematicians walking around
  const layerPeople = el('g', {}, world);
  const hat2d = (type, color, g) => {
    if (type === 'box') el('rect', { x: -4.5, y: -21, width: 9, height: 5, fill: color }, g);
    else if (type === 'beret') el('ellipse', { cx: -1, cy: -18, rx: 6, ry: 2.6, fill: color }, g);
    else if (type === 'wig') { el('circle', { cx: -4, cy: -13, r: 4.5, fill: color }, g); el('circle', { cx: 4, cy: -13, r: 4.5, fill: color }, g); el('ellipse', { cx: 0, cy: -17, rx: 6, ry: 3, fill: color }, g); }
    else if (type === 'tophat') { el('rect', { x: -3.5, y: -26, width: 7, height: 8, fill: color }, g); el('rect', { x: -6.5, y: -18.5, width: 13, height: 1.8, fill: color }, g); }
    else if (type === 'turban') el('ellipse', { cx: 0, cy: -18, rx: 6, ry: 4, fill: color, stroke: 'var(--ink)', 'stroke-width': .5 }, g);
    else if (type === 'bicorne') el('path', { d: 'M-8,-17 Q0,-26 8,-17Z', fill: color }, g);
    else el('path', { d: 'M-5,-15 Q0,-21 5,-15Z', fill: '#3a2a1f' }, g);
  };
  const walkers = COURSE.people.map((P, k) => {
    const isl = COURSE.islands.find(i => i.id === P.island); const [cx, cy] = isl.pos, r = isl.r;
    const rp = () => { const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r * .6; return [cx + Math.cos(a) * d * 1.1, cy + Math.sin(a) * d * .75]; };
    const g = el('g', { style: 'cursor:pointer', tabindex: 0, role: 'button', 'aria-label': P.name }, layerPeople);
    const body = el('g', {}, g);
    el('ellipse', { cx: 0, cy: 1, rx: 6, ry: 2, fill: 'var(--ink)', opacity: .18 }, body);
    el('path', { d: 'M-6,0 L0,-12 L6,0Z', fill: P.look.robe, stroke: 'var(--ink)', 'stroke-width': .8 }, body);
    el('circle', { cy: -14, r: 4.6, fill: '#f1c9a5', stroke: 'var(--ink)', 'stroke-width': .8 }, body);
    hat2d(P.look.hat, P.look.hatColor, body);
    el('circle', { cx: 1.6, cy: -14.5, r: .8, fill: '#1b1b1b', class: 'eye' }, body);
    const nm = el('text', { y: 11, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 600, fill: 'var(--ink)', 'paint-order': 'stroke', stroke: 'var(--sea)', 'stroke-width': 3 }, g); nm.textContent = P.name;
    const go = () => UI.open({ type: 'person', id: P.id });
    g.addEventListener('click', e => { e.stopPropagation(); if (!dragged) go(); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const p0 = rp();
    return { P, g, body, pos: p0, target: rp(), wait: Math.random() * 2, rp, phase: k, dir: 1 };
  });
  const bub = el('g', { 'pointer-events': 'none', opacity: 0 }, layerPeople);
  const bubRect = el('rect', { rx: 8, fill: 'var(--paper)', stroke: 'var(--ink)', 'stroke-width': 1.2 }, bub);
  const bubTail = el('path', { fill: 'var(--paper)', stroke: 'var(--ink)', 'stroke-width': 1.2 }, bub);
  const bubText = el('text', { 'font-size': 13, 'font-family': 'var(--f-display)', fill: 'var(--ink)', 'text-anchor': 'middle' }, bub);
  let bubWho = null, nextBub = 1.5, last = performance.now();
  function stepPeople(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
    walkers.forEach(w => {
      let bob = 0;
      if (w.wait > 0) w.wait -= dt;
      else {
        const dx = w.target[0] - w.pos[0], dy = w.target[1] - w.pos[1], L = Math.hypot(dx, dy);
        if (L < 1) { w.wait = 1 + Math.random() * 3; w.target = w.rp(); }
        else { const s = Math.min(L, dt * 9); w.pos[0] += dx / L * s; w.pos[1] += dy / L * s; w.dir = dx >= 0 ? 1 : -1; bob = Math.abs(Math.sin(t * 9 + w.phase)) * 1.6; }
      }
      w.g.setAttribute('transform', `translate(${w.pos[0].toFixed(1)},${w.pos[1].toFixed(1)})`);
      w.body.setAttribute('transform', `translate(0,${-bob.toFixed(2)}) scale(${w.dir * 1.45},1.45)`);
    });
    nextBub -= dt;
    if (nextBub <= 0) {
      bubWho = walkers[Math.floor(Math.random() * walkers.length)]; bubText.textContent = bubWho.P.say;
      const bw = bubWho.P.say.length * 13 + 18; bubRect.setAttribute('width', bw); bubRect.setAttribute('height', 22); bubRect.setAttribute('x', -bw / 2); bubRect.setAttribute('y', -22);
      bubTail.setAttribute('d', 'M-5,-1 L0,6 L5,-1'); bubText.setAttribute('y', -6.5);
      bub.setAttribute('opacity', 1); nextBub = 4.5;
    }
    if (bubWho) bub.setAttribute('transform', `translate(${bubWho.pos[0].toFixed(1)},${(bubWho.pos[1] - 42).toFixed(1)})`);
    if (!reduce) requestAnimationFrame(stepPeople);
  }
  requestAnimationFrame(stepPeople);

  // pan / zoom on viewBox
  let vb = innerWidth > 700 ? { x: -250, y: -20, w: W + 270, h: H + 40 } : { x: 0, y: 0, w: W, h: H }, drag = null, dragged = false;
  const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); const s = Math.max(vb.w / r.width, vb.h / r.height); const ox = (r.width * s - vb.w) / 2, oy = (r.height * s - vb.h) / 2; return [vb.x + (cx - r.left) * s - ox, vb.y + (cy - r.top) * s - oy, s]; };
  const pointers = new Map(); let pinch = null;
  svg.addEventListener('pointerdown', e => { pointers.set(e.pointerId, e); dragged = false; if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vb: { ...vb } }; else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), vb: { ...vb } }; } });
  svg.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, e);
    if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, pinch.d / d, pinch.vb); dragged = true; return; }
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) { dragged = true; svg.setPointerCapture(e.pointerId); svg.style.cursor = 'grabbing'; }
    if (dragged) { const [, , s] = toSvg(0, 0); vb.x = drag.vb.x - dx * s; vb.y = drag.vb.y - dy * s; setVB(); }
  });
  const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) { drag = null; svg.style.cursor = 'grab'; setTimeout(() => dragged = false, 0); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  function zoomAt(cx, cy, f, base) { const b = base || vb; const [px, py] = toSvg(cx, cy); const nw = Math.min(W * 1.6, Math.max(W / 5, b.w * f)); const k = nw / b.w; vb = { x: px - (px - b.x) * k, y: py - (py - b.y) * k, w: nw, h: b.h * k }; setVB(); }
  setVB();
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.12 : 1 / 1.12); }, { passive: false });

  UI.init();
})();
</script>
