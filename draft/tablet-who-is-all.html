:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1d2733; --muted:#5f6c7a; --line:#c9d3de;
  --navy:#2e5a88; --orange:#c1652f; --green:#2f7a4c; --greenbg:#e5f2e9; --rose:#b8433f; --rosebg:#fbe9e7;
  --sand:#f3d9a4;
  --zh:Bk,"BiauKai","DFKai-SB",serif; --num:Bn,"Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:24px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;padding-inline:16px}
.m{font-family:var(--num);white-space:nowrap;letter-spacing:.02em}
b{font-weight:normal;color:var(--orange)}
.sq{display:inline-block;width:1em;height:1em;border:2px solid currentColor;vertical-align:-.12em;margin:0 .1em;border-radius:3px}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

/* 首頁 */
.hero{text-align:center;padding-top:8px}
.hero h1{font-weight:normal;font-size:52px;color:var(--navy);margin:0;line-height:1.3}
.hero p{margin:4px 0 0;color:var(--muted);font-size:24px}
.levels{display:grid;grid-template-columns:1fr;gap:12px}
.lv{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;text-align:left;
  display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:center;min-height:96px}
.lv:active{transform:scale(.98)}
.lv .no{grid-row:span 2;width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;
  font-family:var(--num);font-size:30px;display:flex;align-items:center;justify-content:center}
.lv .tt{font-size:32px;line-height:1.4;min-width:0}
.lv .st{font-family:var(--num);font-size:24px;color:var(--orange);letter-spacing:.1em}
.lv.done{border-color:var(--green)}
.lv.done .no{background:var(--green)}
.reset{align-self:center;color:var(--muted);font-size:16px;text-decoration:underline;padding:8px}

/* 關卡 */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-size:20px}
.bar .name{flex:1 1 260px;min-width:0;color:var(--navy);font-size:28px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--green)}
.dots i.now{background:var(--orange)}
.card{background:var(--card);border-radius:22px;padding:20px 22px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.qrow{display:flex;gap:12px;align-items:flex-start}
.q{flex:1;min-width:0;font-size:34px;line-height:1.75}
.spk{flex:0 0 52px;height:52px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.spk svg{width:28px;height:28px}
.fig{display:flex;justify-content:center;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.work{align-self:flex-start;border:2px dashed var(--rose);border-radius:12px;padding:4px 16px;font-size:26px}
.work .m{font-size:30px}
.ask{font-size:30px;color:var(--navy);border-top:2px dotted var(--line);padding-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{flex:1 1 200px;min-height:76px;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:8px 16px;font-size:30px;text-align:center}
.opt .m{font-size:32px}
.opt.ok{border-color:var(--green);background:var(--greenbg)}
.opt.no{border-color:var(--rose);background:var(--rosebg);opacity:.75}
.opts.long .opt{flex-basis:100%;text-align:left}
.numrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.disp{min-width:160px;height:72px;border:3px solid var(--navy);border-radius:14px;font-family:var(--num);font-size:44px;
  display:flex;align-items:center;justify-content:center;padding:0 16px;background:#fff}
.disp.ok{border-color:var(--green);background:var(--greenbg)}
.disp.no{border-color:var(--rose);background:var(--rosebg)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.pad button{height:68px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-family:var(--num);font-size:34px}
.pad button:active{background:var(--line)}
.pad .wide{grid-column:span 2;font-family:var(--zh);font-size:26px;background:var(--navy);color:#fff;border-color:var(--navy)}
.pad .del{font-family:var(--zh);font-size:22px}
.fb{border-radius:14px;padding:10px 16px;font-size:28px}
.fb.ok{background:var(--greenbg);color:var(--green)}
.fb.no{background:var(--rosebg);color:var(--ink)}
.fb .h{color:var(--rose)}
.next{align-self:flex-end;background:var(--orange);color:#fff;border-radius:999px;padding:8px 28px;font-size:28px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.finish{text-align:center;padding:24px 10px}
.finish .big{font-family:var(--num);font-size:72px;color:var(--orange);letter-spacing:.15em}
.finish h2{font-weight:normal;color:var(--green);font-size:36px;margin:6px 0}
.finish .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.finish .btns button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 22px;font-size:24px}
.finish .btns .go{background:var(--orange);border-color:var(--orange);color:#fff}
@media (max-width:520px){
  body{font-size:20px}.q{font-size:26px}.ask{font-size:24px}.fb{font-size:22px}.lv .tt{font-size:26px}.bar .name{font-size:22px}.hero h1{font-size:40px}
  .pad button{height:58px;font-size:28px}.pad .wide{font-size:22px}.opt{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

lass=\"m\">40 + 20</span>", "sayhint": "40 加 20"}]}, {"q": "小華的題目：樹上有 <span class=\"m\">50</span> 隻鳥，飛走一些，還剩 <span class=\"m\">32</span> 隻。飛走了幾隻？", "say": "小華的題目：樹上有 50 隻鳥，飛走一些，還剩 32 隻。飛走了幾隻？", "fig": "", "done": "", "work": "<span class=\"m\">50 + 32 = 82</span>", "steps": [{"t": "choice", "ask": "小華錯在哪裡？", "sayask": "小華錯在哪裡？", "a": 0, "hint": "兩個都說用減，可是只有一個說出了真正的理由：不知道的是一段。", "sayhint": "兩個都說用減，可是只有一個說出了真正的理由：不知道的是一段。", "opts": ["飛走的是一段，要用減。", "題目有「飛走」，要用減。"]}, {"t": "num", "ask": "飛走了幾隻？", "sayask": "飛走了幾隻？", "a": 18, "hint": "<span class=\"m\">50 − 32</span>", "sayhint": "50 減 32"}]}]}];
const UI = {"誰是全部？": "誰是全部？", "第": "第", "關": "關", "回到關卡": "回到關卡", "下一題": "下一題", "再試一次": "再試一次", "答對了！": "答對了！", "想一想：": "想一想：", "答案是": "答案是", "這一關完成了！": "這一關完成了！", "再玩一次": "再玩一次", "唸給我聽": "唸給我聽", "刪掉": "刪掉", "好了": "好了", "他寫：": "他寫：", "一天玩一關，和讀本的第幾天對應。": "一天玩一關，和讀本的第幾天對應󠇡。", "完成": "完成", "還沒玩": "還沒玩", "題": "題", "換下一關": "換下一關", "先在讀本讀完那一天，再來玩同一關。": "先在讀本讀完那一天，再來玩同一關。", "全部清掉重來": "全部清掉重󠇡來"};
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const app = document.getElementById('app');
let S = {view: 'home'};
let stars = {};
try { stars = JSON.parse(localStorage.getItem('e2r-stars') || '{}') || {}; } catch (e) { stars = {}; }
function save() { try { localStorage.setItem('e2r-stars', JSON.stringify(stars)); } catch (e) {} }

function speak(t) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-TW'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);

function home() {
  S = {view: 'home'};
  let h = `<div class="hero"><h1>${UI['誰是全部？']}</h1><p>${UI['先在讀本讀完那一天，再來玩同一關。']}</p></div><div class="levels">`;
  for (const L of DATA) {
    const s = stars[L.n] || 0;
    h += `<button class="lv${s ? ' done' : ''}" data-lv="${L.n}"><span class="no">${L.n}</span>
      <span class="tt">${L.title}</span><span class="st">${s ? starStr(s) : UI['還沒玩']}</span></button>`;
  }
  h += `</div>`;
  if (Object.keys(stars).length) h += `<button class="reset" id="reset">${UI['全部清掉重來']}</button>`;
  app.innerHTML = h;
  app.querySelectorAll('.lv').forEach(b => b.onclick = () => start(+b.dataset.lv));
  const r = document.getElementById('reset');
  if (r) r.onclick = () => { stars = {}; save(); home(); };
  window.scrollTo(0, 0);
}

function start(n) {
  S = {view: 'lv', n, i: 0, step: 0, wrong: 0, miss: 0, input: '', solved: false, fb: null, picked: {}};
  draw();
}

function cur() { return DATA[S.n - 1].items[S.i]; }

function draw() {
  const L = DATA[S.n - 1], it = cur(), st = it.steps[S.step];
  let dots = L.items.map((_, k) => `<i class="${k < S.i ? 'ok' : k === S.i ? 'now' : ''}"></i>`).join('');
  let h = `<div class="bar"><button class="back" id="back">← ${UI['回到關卡']}</button>
    <span class="name">${UI['第']} <span class="m">${L.n}</span> ${UI['關']}　${L.title}</span><span class="dots">${dots}</span></div>`;
  h += `<div class="card" id="card"><div class="qrow"><div class="q">${it.q}</div>
    <button class="spk" id="spk" aria-label="唸給我聽">${SPK}</button></div>`;
  const fig = (S.solved && it.done) ? it.done : it.fig;
  if (fig) h += `<div class="fig">${fig}</div>`;
  if (it.work) h += `<div class="work">${UI['他寫：']} ${it.work}</div>`;
  // 已完成的前面步驟
  for (let k = 0; k < S.step; k++) {
    const p = it.steps[k];
    h += `<div class="ask">${p.ask || ''}</div><div class="fb ok">${p.t === 'num' ? `<span class="m">${p.a}</span>` : p.opts[p.a]}</div>`;
  }
  if (!S.solved) {
    if (st.ask) h += `<div class="ask">${st.ask}</div>`;
    if (st.t === 'choice') {
      const long = st.opts.some(o => o.replace(/<[^>]+>/g, '').length > 14);
      h += `<div class="opts${long ? ' long' : ''}">` + st.opts.map((o, k) =>
        `<button class="opt ${S.picked[k] || ''}" data-k="${k}">${o}</button>`).join('') + `</div>`;
    } else {
      h += `<div class="numrow"><div class="disp ${S.dispCls || ''}" id="disp">${S.input || '&nbsp;'}</div></div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(d => `<button data-d="${d}">${d}</button>`).join('')}
        <button class="del" data-d="del">${UI['刪掉']}</button><button class="wide" data-d="ok">${UI['好了']}</button></div>`;
    }
  }
  if (S.fb) h += S.fb;
  if (S.solved) h += `<button class="next" id="next">${S.i + 1 < L.items.length ? UI['下一題'] : UI['完成']} →</button>`;
  h += `</div>`;
  app.innerHTML = h;
  document.getElementById('back').onclick = home;
  document.getElementById('spk').onclick = () => speak(it.say + (S.solved ? '' : ' ' + (st.sayask || '')));
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
  app.querySelectorAll('.pad button').forEach(b => b.onclick = () => key(b.dataset.d));
  const nx = document.getElementById('next');
  if (nx) nx.onclick = next;
}

function right() {
  const it = cur();
  S.step++; S.picked = {}; S.input = ''; S.dispCls = ''; S.tries = 0;
  if (S.step >= it.steps.length) {
    S.solved = true; S.step = it.steps.length;
    S.fb = `<div class="fb ok">${UI['答對了！']}</div>`;
  } else S.fb = null;
  draw();
}
function wrongAns(st) {
  S.wrong++; S.tries = (S.tries || 0) + 1;
  let msg = `<div class="fb no"><span class="h">${UI['想一想：']}</span> ${st.hint}</div>`;
  if (st.t === 'num' && S.tries >= 2) msg = `<div class="fb no"><span class="h">${UI['想一想：']}</span> ${st.hint}　${UI['答案是']} <span class="m">${st.a}</span></div>`;
  S.fb = msg;
  draw();
  const c = document.getElementById('card'); c.classList.add('shake');
  speak(st.sayhint);
}
function choose(k) {
  const st = cur().steps[S.step];
  if (k === st.a) { S.picked = {[k]: 'ok'}; draw(); setTimeout(right, 450); }
  else { S.picked[k] = 'no'; wrongAns(st); }
}
function key(d) {
  const st = cur().steps[S.step];
  if (d === 'del') { S.input = S.input.slice(0, -1); S.dispCls = ''; }
  else if (d === 'ok') {
    if (!S.input) return;
    if (+S.input === st.a) { S.dispCls = 'ok'; draw(); setTimeout(right, 450); return; }
    S.dispCls = 'no'; wrongAns(st); S.input = ''; return;
  } else if (S.input.length < 3) { S.input += d; S.dispCls = ''; }
  const el = document.getElementById('disp');
  el.className = 'disp ' + (S.dispCls || ''); el.innerHTML = S.input || '&nbsp;';
}
function next() {
  const L = DATA[S.n - 1];
  if (S.i + 1 < L.items.length) {
    S.i++; S.step = 0; S.solved = false; S.fb = null; S.picked = {}; S.input = ''; S.tries = 0;
    draw(); window.scrollTo(0, 0);
  } else finish();
}
function finish() {
  const n = S.wrong === 0 ? 3 : S.wrong <= 3 ? 2 : 1;
  stars[S.n] = Math.max(stars[S.n] || 0, n); save();
  const hasNext = S.n < DATA.length;
  app.innerHTML = `<div class="card finish"><div class="big">${starStr(n)}</div><h2>${UI['這一關完成了！']}</h2>
    <div class="btns"><button id="again">${UI['再玩一次']}</button><button id="home">${UI['回到關卡']}</button>
    ${hasNext ? `<button class="go" id="nextlv">${UI['換下一關']} →</button>` : ''}</div></div>`;
  document.getElementById('again').onclick = () => start(S.n);
  document.getElementById('home').onclick = home;
  if (hasNext) document.getElementById('nextlv').onclick = () => start(S.n + 1);
}
const hash = (location.hash || '').replace('#', '');
if (/^lv[1-5]$/.test(hash)) start(+hash[2]); else home();
</script>
