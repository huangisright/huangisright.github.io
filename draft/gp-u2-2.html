<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>最短的那一圈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>
:root{
  --paper:#F5F2E8; --grid:rgba(46,90,136,.07); --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C;
  --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --s1:#2E5A88; --s2:#4A7C59; --s3:#A8701E; --s4:#7A4E8C; --s5:#2D7F86;
  --shape-fill:rgba(46,90,136,.05);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
    --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
    --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
    --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
    --shape-fill:rgba(130,173,220,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
  --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
  --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
  --shape-fill:rgba(130,173,220,.07);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:26px 40px}
header{margin-bottom:16px}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:600}
h1{font-family:var(--serif); font-size:clamp(28px,4.6vw,40px); margin:4px 0 6px; line-height:1.25; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:16px}
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:14px}
.stage{padding:8px}
#stage{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; user-select:none}
#stage:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:8px}
.shape{fill:var(--shape-fill); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.vlab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink-2)}
.plab{font-family:var(--math); font-style:italic; font-size:21px; fill:var(--ink); font-weight:600}
.foot{stroke-width:2.2; stroke-dasharray:6 4}
.ext{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 5; fill:none}
.pdot{fill:var(--orange); stroke:var(--card); stroke-width:3}
.hint{font-size:13px; color:var(--ink-3); margin:4px 6px 0}
.rows{display:grid; gap:8px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:17px}
.sw{width:12px; height:12px; border-radius:3px}
.row .val{font-family:var(--math); font-size:26px; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
.row .val.neg{color:var(--crimson)}
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--edge)}
.sum .k{font-size:17px; font-weight:600}
.sum .v{font-family:var(--math); font-size:clamp(46px,7vw,64px); line-height:1; color:var(--orange);
  font-variant-numeric:tabular-nums; font-weight:600}
.strip-wrap{margin-top:14px}
.strip-cap{font-size:13px; color:var(--ink-3); margin-bottom:4px}
#strip{width:100%; height:auto; display:block}
.tick{font-family:var(--math); font-size:12px; fill:var(--ink-3)}
.controls{display:grid; gap:12px; margin-top:14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:8px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{font:inherit; font-size:14px; padding:7px 12px; border:0; border-right:1px solid var(--edge-soft);
  background:var(--card); color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#161A1E} }
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:inherit; font-size:15px; padding:8px 14px; border-radius:8px; border:1px solid var(--edge);
  background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{border-color:var(--orange); color:var(--orange); font-weight:600}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.check{display:flex; gap:8px; align-items:center; font-size:15px; color:var(--ink-2); cursor:pointer}
.stat{font-size:15px; color:var(--ink-2); min-height:1.6em}
.stat b{font-family:var(--math); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.same{color:var(--green)}
.stat.same b{color:var(--green)}
details{border-top:1px dashed var(--edge); padding-top:10px}
summary{cursor:pointer; font-size:13px; color:var(--ink-3)}
details .btns{margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.ln{stroke:var(--ink); stroke-width:2.4; stroke-linejoin:round; fill:var(--shape-fill)}
.path{stroke:var(--indigo); stroke-width:2.8; fill:none; stroke-linejoin:round}
.mid{stroke:var(--ink-3); stroke-width:1.4; stroke-dasharray:4 4; fill:none}
.ghost{stroke:var(--ink-3); stroke-width:1.3; stroke-dasharray:5 5; fill:none}
.ghost2{stroke:var(--orange); stroke-width:1.8; stroke-dasharray:7 5; fill:none}
.lab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink)}
.lab2{font-family:var(--math); font-style:italic; font-size:18px; fill:var(--ink-3)}
.drag{fill:var(--orange); stroke:var(--card); stroke-width:3; cursor:grab}
.drag.on{fill:var(--indigo)}
.hit{fill:transparent; cursor:grab}
.pt2{fill:var(--ink-3)}
.q{font-size:15px; color:var(--indigo); margin:4px 0 0; font-weight:600}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元二　第 2 節</div>
    <h1>最短的那一圈</h1>
    <p class="lede">三角形的三邊上各取一點，連成一圈。哪一圈最短？先猜，再拖。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 400" role="img" aria-label="三角形與內接的一圈" tabindex="0"></svg>
      <p class="hint">拖動藍色的 <i>D</i>、<i>E</i>、<i>F</i>，也可以拖橘色的頂點改變三角形。單位 mm；預設和學習單第 1 頁一樣大。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--ink-3)"></span><span>中點那一圈</span><span class="val" id="vMid"></span></div>
        <div class="row"><span class="sw" style="background:var(--crimson)"></span><span>∠<i>A</i></span><span class="val" id="vA"></span></div>
        <div class="sum"><span class="k">這一圈的周長</span><span class="v" id="vPer"></span></div>
      </div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機跑 1000 組</button>
          <button type="button" class="btn" id="midBtn">放到中點</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦試了一千組。沒試過的那些呢？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="pin" aria-pressed="false">釘住 <i>D</i></button>
            <button type="button" class="btn" id="feet">垂足那一圈</button>
          </div>
          <p class="hint" id="pinNote" hidden></p>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R2D = 180 / Math.PI;
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const HOME = { A: [21, 72], B: [0, 0], C: [51, 0], tD: 0.62, tE: 0.45, tF: 0.58 };
  const s = JSON.parse(JSON.stringify(HOME));
  let pinned = false, running = false, drag = null, K = 4, O = [0, 0];

  function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const lerp = (P, Q, t) => [P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t];
  function reflect(P, A, B){ const ux = B[0]-A[0], uy = B[1]-A[1], L = ux*ux + uy*uy; const t = ((P[0]-A[0])*ux + (P[1]-A[1])*uy) / L; const F = [A[0] + t*ux, A[1] + t*uy]; return [2*F[0] - P[0], 2*F[1] - P[1]]; }
  function footT(P, U, V){ const ux = V[0]-U[0], uy = V[1]-U[1]; return Math.max(0, Math.min(1, ((P[0]-U[0])*ux + (P[1]-U[1])*uy) / (ux*ux + uy*uy))); }
  function angA(){ const u = [s.B[0]-s.A[0], s.B[1]-s.A[1]], v = [s.C[0]-s.A[0], s.C[1]-s.A[1]]; return Math.acos((u[0]*v[0] + u[1]*v[1]) / (Math.hypot(...u) * Math.hypot(...v))) * R2D; }
  const pts = (tD, tE, tF) => [lerp(s.B, s.C, tD), lerp(s.C, s.A, tE), lerp(s.A, s.B, tF)];
  function per(tD, tE, tF){ const [D, E, F] = pts(tD, tE, tF); return dist(D, E) + dist(E, F) + dist(F, D); }
  // 釘住 D：在兩條邊上找最好的 E、F（網格加兩輪細找）
  function bestEF(tD){
    let bE = 0, bF = 0, bv = Infinity, step = 1 / 80;
    for (let i = 0; i <= 80; i++) for (let j = 0; j <= 80; j++){ const v = per(tD, i*step, j*step); if (v < bv){ bv = v; bE = i*step; bF = j*step; } }
    for (let r = 0; r < 3; r++){ const e0 = bE, f0 = bF, h = step; step /= 10;
      for (let i = -10; i <= 10; i++) for (let j = -10; j <= 10; j++){ const e = Math.max(0, Math.min(1, e0 + i*step)), f = Math.max(0, Math.min(1, f0 + j*step)); const v = per(tD, e, f); if (v < bv){ bv = v; bE = e; bF = f; } } }
    return [bE, bF, bv];
  }

  function frame(){ if (drag) return; const P = [s.A, s.B, s.C];
    if (pinned){ const D = lerp(s.B, s.C, s.tD); P.push(reflect(D, s.A, s.B), reflect(D, s.A, s.C)); }
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    K = Math.min(380 / (x1 - x0 || 1), 330 / (y1 - y0 || 1));
    O = [30 + (380 - (x1 - x0) * K) / 2 - x0 * K, 34 + (330 - (y1 - y0) * K) / 2 + y1 * K]; }
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];

  function draw(){
    if (pinned && !running){ const r = bestEF(s.tD); s.tE = r[0]; s.tF = r[1]; }
    frame(); svg.innerHTML = "";
    const A = X(s.A), B = X(s.B), C = X(s.C);
    el("polygon", { points: [A, B, C].map(p => p.join(",")).join(" "), class: "ln" });
    const Mm = [lerp(s.B, s.C, .5), lerp(s.C, s.A, .5), lerp(s.A, s.B, .5)].map(X);
    el("polygon", { points: Mm.map(p => p.join(",")).join(" "), class: "mid" });
    const [Dw, Ew, Fw] = pts(s.tD, s.tE, s.tF), D = X(Dw), E = X(Ew), F = X(Fw);
    if (pinned){
      const D1 = X(reflect(Dw, s.A, s.B)), D2 = X(reflect(Dw, s.A, s.C));
      [[D, D1], [D, D2], [A, D1], [A, D2]].forEach(([p, q]) => el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: "ghost" }));
      el("line", { x1: D1[0], y1: D1[1], x2: D2[0], y2: D2[1], class: "ghost2" });
      el("circle", { cx: D1[0], cy: D1[1], r: 5, class: "pt2" }); el("circle", { cx: D2[0], cy: D2[1], r: 5, class: "pt2" });
      txt(D1[0] - 18, D1[1] + 6, "D₁", "lab2"); txt(D2[0] + 18, D2[1] + 6, "D₂", "lab2");
      const d12 = dist(reflect(Dw, s.A, s.B), reflect(Dw, s.A, s.C)), ad = dist(s.A, Dw);
      $("pinNote").innerHTML = angA() < 90
        ? `<i>D</i> 不動時最短 ＝ <i>D</i>₁<i>D</i>₂ ＝ ${fmt(d12)}　<i>AD</i> ＝ ${fmt(ad)}　兩者相除 ＝ ${(d12 / ad).toFixed(3)}`
        : `∠<i>A</i> 不是銳角：<i>D</i>₁<i>D</i>₂ 碰不到兩邊，最好的是 <i>E</i>、<i>F</i> 都擠到 <i>A</i>。`;
    }
    el("polygon", { points: [D, E, F].map(p => p.join(",")).join(" "), class: "path" });
    const cen = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
    const out = (p, d) => { const v = [p[0] - cen[0], p[1] - cen[1]], L = Math.hypot(...v) || 1; return [p[0] + v[0] / L * d, p[1] + v[1] / L * d + 6]; };
    [[A, "A"], [B, "B"], [C, "C"]].forEach(([p, t]) => { const q = out(p, 20); txt(q[0], q[1], t, "lab"); });
    [[D, "D"], [E, "E"], [F, "F"]].forEach(([p, t]) => { const q = out(p, 18); txt(q[0], q[1], t, "lab"); });
    ["A", "B", "C"].forEach((k, i) => handle([A, B, C][i], k, false));
    handle(D, "D", true); if (!pinned){ handle(E, "E", true); handle(F, "F", true); }
    else { el("circle", { cx: E[0], cy: E[1], r: 6, class: "pt2" }); el("circle", { cx: F[0], cy: F[1], r: 6, class: "pt2" }); }
    const a = dist(s.B, s.C), b = dist(s.C, s.A), c = dist(s.A, s.B);
    $("vMid").textContent = fmt((a + b + c) / 2); $("vA").textContent = fmt(angA()) + "°";
    $("vPer").textContent = fmt(per(s.tD, s.tE, s.tF));
  }
  function handle(p, id, on){
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id });
    el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag" + (on ? " on" : ""), "data-h": id });
  }

  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); clearStat(); });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return; const w = W(svgPt(ev));
    if (drag === "D") s.tD = footT(w, s.B, s.C);
    else if (drag === "E") s.tE = footT(w, s.C, s.A);
    else if (drag === "F") s.tF = footT(w, s.A, s.B);
    else { const old = s[drag]; s[drag] = w; // 不讓三角形塌掉
      const ar = Math.abs((s.B[0]-s.A[0])*(s.C[1]-s.A[1]) - (s.C[0]-s.A[0])*(s.B[1]-s.A[1])) / 2;
      if (ar < 150) s[drag] = old; }
    draw();
  });
  const end = () => { if (drag){ drag = null; draw(); } };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("stat").className = "stat"; $("ask").hidden = true; }

  $("midBtn").addEventListener("click", () => { if (running) return; setPin(false); s.tD = s.tE = s.tF = 0.5; clearStat(); draw(); });
  $("home").addEventListener("click", () => { if (running) return; Object.assign(s, JSON.parse(JSON.stringify(HOME))); setPin(false); clearStat(); draw(); });
  function setPin(on){ pinned = on; $("pin").setAttribute("aria-pressed", String(on)); $("pin").innerHTML = on ? "放開 <i>D</i>" : "釘住 <i>D</i>"; $("pinNote").hidden = !on; }
  $("pin").addEventListener("click", () => { if (running) return; setPin(!pinned); clearStat(); draw(); });
  $("feet").addEventListener("click", () => { if (running) return; setPin(false);
    s.tD = footT(s.A, s.B, s.C); s.tE = footT(s.B, s.C, s.A); s.tF = footT(s.C, s.A, s.B); clearStat(); draw();
    $("stat").innerHTML = angA() < 90 ? `垂足那一圈：周長 <b>${fmt(per(s.tD, s.tE, s.tF))}</b>` : `∠<i>A</i> 不是銳角，有的垂足落在邊的外面。`; });

  $("run").addEventListener("click", () => {
    if (running) return; setPin(false); running = true; $("run").disabled = true; clearStat();
    const N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 10;
    let done = 0, best = Infinity, arg = null; const st = $("stat");
    function tick(){
      for (let i = 0; i < step && done < N; i++, done++){
        const t = [Math.random(), Math.random(), Math.random()], v = per(...t);
        if (v < best){ best = v; arg = t; } [s.tD, s.tE, s.tF] = t;
      }
      draw(); st.innerHTML = `試了 <b>${done}</b> 組，目前最短 <b>${fmt(best)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else { [s.tD, s.tE, s.tF] = arg; running = false; $("run").disabled = false; draw();
        st.innerHTML = `試了 <b>${N}</b> 組：最短 <b>${fmt(best)}</b>（畫面上這一圈）`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return; ev.preventDefault();
    s.tD = Math.max(0, Math.min(1, s.tD + (ev.key === "ArrowLeft" ? -0.01 : 0.01))); clearStat(); draw(); });

  draw();
})();
</script>

</body></html>
