<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>切下來的那一塊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>
:root{
  --paper:#F5F2E8; --grid:rgba(46,90,136,.07); --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C;
  --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --s1:#2E5A88; --s2:#4A7C59; --s3:#A8701E; --s4:#7A4E8C; --s5:#2D7F86;
  --shape-fill:rgba(46,90,136,.05);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
    --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
    --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
    --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
    --shape-fill:rgba(130,173,220,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A;
  --indigo:#82ADDC; --orange:#E08A54; --green:#7FB08D; --green-soft:#1E2A22; --crimson:#E07A7A;
  --s1:#82ADDC; --s2:#7FB08D; --s3:#D9A55A; --s4:#B892CC; --s5:#6FC0C6;
  --shape-fill:rgba(130,173,220,.07);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:26px 40px}
header{margin-bottom:16px}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:600}
h1{font-family:var(--serif); font-size:clamp(28px,4.6vw,40px); margin:4px 0 6px; line-height:1.25; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:16px}
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:14px}
.stage{padding:8px}
#stage{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; user-select:none}
#stage:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:8px}
.shape{fill:var(--shape-fill); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.vlab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink-2)}
.plab{font-family:var(--math); font-style:italic; font-size:21px; fill:var(--ink); font-weight:600}
.foot{stroke-width:2.2; stroke-dasharray:6 4}
.ext{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 5; fill:none}
.pdot{fill:var(--orange); stroke:var(--card); stroke-width:3}
.hint{font-size:13px; color:var(--ink-3); margin:4px 6px 0}
.rows{display:grid; gap:8px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:17px}
.sw{width:12px; height:12px; border-radius:3px}
.row .val{font-family:var(--math); font-size:26px; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
.row .val.neg{color:var(--crimson)}
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--edge)}
.sum .k{font-size:17px; font-weight:600}
.sum .v{font-family:var(--math); font-size:clamp(46px,7vw,64px); line-height:1; color:var(--orange);
  font-variant-numeric:tabular-nums; font-weight:600}
.strip-wrap{margin-top:14px}
.strip-cap{font-size:13px; color:var(--ink-3); margin-bottom:4px}
#strip{width:100%; height:auto; display:block}
.tick{font-family:var(--math); font-size:12px; fill:var(--ink-3)}
.controls{display:grid; gap:12px; margin-top:14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:8px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{font:inherit; font-size:14px; padding:7px 12px; border:0; border-right:1px solid var(--edge-soft);
  background:var(--card); color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#161A1E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#161A1E} }
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:inherit; font-size:15px; padding:8px 14px; border-radius:8px; border:1px solid var(--edge);
  background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{border-color:var(--orange); color:var(--orange); font-weight:600}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.check{display:flex; gap:8px; align-items:center; font-size:15px; color:var(--ink-2); cursor:pointer}
.stat{font-size:15px; color:var(--ink-2); min-height:1.6em}
.stat b{font-family:var(--math); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.same{color:var(--green)}
.stat.same b{color:var(--green)}
details{border-top:1px dashed var(--edge); padding-top:10px}
summary{cursor:pointer; font-size:13px; color:var(--ink-3)}
details .btns{margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.ln{stroke:var(--ink); stroke-width:2.4; stroke-linejoin:round; fill:var(--shape-fill)}
.cut{stroke:var(--indigo); stroke-width:2.6; stroke-linejoin:round; fill:rgba(46,90,136,.14)}
.cut.same{fill:rgba(74,124,89,.28); stroke:var(--green)}
.cut2{stroke:var(--indigo); stroke-width:1.4; fill:none; opacity:.8}
.eq{stroke:var(--orange); stroke-width:5; stroke-linecap:round; opacity:.75}
.lab{font-family:var(--math); font-style:italic; font-size:20px; fill:var(--ink)}
.q{font-size:15px; color:var(--indigo); margin:4px 0 0; font-weight:600}
.slider{display:flex; align-items:center; gap:8px; margin:6px 0 10px; font-size:15px}
.slider input{flex:1; min-width:0}
.slider button{width:34px; height:34px; border-radius:8px; border:1px solid var(--edge); background:var(--card); color:var(--ink); font-size:16px; cursor:pointer; flex:none}
.angs{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:15px; margin:4px 0 8px}
.angs .v{font-family:var(--math); font-size:19px; text-align:right}
.badge{display:inline-block; padding:4px 10px; border-radius:999px; font-size:14px; font-weight:600; background:var(--edge-soft); color:var(--ink-2)}
.badge.on{background:var(--green-soft); color:var(--green)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元三　第 3 節</div>
    <h1>切下來的那一塊</h1>
    <p class="lede">等腰三角形，把底角 ∠<i>B</i> 平分，切下 △<i>BCD</i>。頂角幾度時，切下來的和原來的形狀一模一樣？</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 380" role="img" aria-label="等腰三角形與切下來的一塊" tabindex="0"></svg>
      <p class="hint">拉右邊的滑桿改變頂角 ∠<i>A</i>，腰長固定。方向鍵 ←→ 可以 0.1° 微調。</p>
    </div>

    <div class="panel">
      <div class="slider"><span>∠<i>A</i></span><button type="button" id="dn" aria-label="減 0.1 度">−</button><input type="range" id="th" min="50" max="1700" step="1" value="500" aria-label="頂角"><button type="button" id="up" aria-label="加 0.1 度">＋</button><b id="thv"></b></div>
      <div class="angs">
        <span>△<i>ABC</i> 的三個角</span><span class="v" id="a1"></span>
        <span>△<i>BCD</i> 的三個角</span><span class="v" id="a2"></span>
      </div>
      <p><span class="badge" id="same">形狀不一樣</span></p>
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--ink)"></span><span><i>CD</i> ÷ <i>BC</i></span><span class="val" id="r2"></span></div>
        <div class="sum"><span class="k"><i>BC</i> ÷ <i>AB</i></span><span class="v" id="r1"></span></div>
      </div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="scan">掃過所有角度</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>0.6180 後面還有數字嗎？會停嗎？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="again" aria-pressed="false">再切一次</button>
            <button type="button" class="btn" id="eqs" aria-pressed="false">標出一樣長的邊</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
  let th = 50, depth = 0, showEq = false, scanning = false;
  const LEG = 300;
  function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function txt(x, y, t){ const e = el("text", { x, y, class: "lab", "text-anchor": "middle" }); e.textContent = t; return e; }
  const lerp = (P, Q, t) => [P[0] + (Q[0]-P[0])*t, P[1] + (Q[1]-P[1])*t];
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  // 頂點 V、底的兩端 P1 P2：平分 P1 的角，交 V–P2 於 D
  function cutPt(V, P1, P2){ const a = dist(P1, V), b = dist(P1, P2); return lerp(V, P2, a / (a + b)); }
  function angles(t){ const b = (180 - t) / 2; return { abc: [t, b, b], bcd: [b / 2, b, 180 - 1.5 * b] }; }
  function sameShape(t){ const g = angles(t), x = g.abc.slice().sort((p, q) => p - q), y = g.bcd.slice().sort((p, q) => p - q); return x.every((v, i) => Math.abs(v - y[i]) < 0.05); }

  function draw(){
    svg.innerHTML = "";
    const r = th * Math.PI / 180, base = 2 * LEG * Math.sin(r / 2), h = LEG * Math.cos(r / 2);
    const sc = Math.min(1, 400 / base, 330 / h);
    const W = base * sc, H = h * sc, x0 = (440 - W) / 2, y0 = 30 + (330 - H) / 2 + H;
    const B = [x0, y0], C = [x0 + W, y0], A = [x0 + W / 2, y0 - H];
    el("polygon", { points: [A, B, C].map(p => p.join(",")).join(" "), class: "ln" });
    const D = cutPt(A, B, C), same = sameShape(th);
    el("polygon", { points: [B, C, D].map(p => p.join(",")).join(" "), class: "cut" + (same ? " same" : "") });
    if (depth > 0){ // 繼續切：在 △BCD 中頂點是 B，底是 C、D；平分 C 的角
      let V = B, P1 = C, P2 = D;
      for (let i = 0; i < 7; i++){ const E = cutPt(V, P1, P2); el("line", { x1: P1[0], y1: P1[1], x2: E[0], y2: E[1], class: "cut2" }); [V, P1, P2] = [P1, P2, E]; }
    }
    if (showEq){ [[A, D], [B, D], [B, C]].forEach(([p, q]) => el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: "eq" })); }
    txt(A[0], A[1] - 12, "A"); txt(B[0] - 14, B[1] + 20, "B"); txt(C[0] + 14, C[1] + 20, "C"); txt(D[0] + 16, D[1] + 4, "D");
    const g = angles(th);
    $("thv").textContent = f1(th) + "°";
    $("a1").textContent = g.abc.map(f1).join("°、") + "°";
    $("a2").textContent = g.bcd.map(f1).join("°、") + "°";
    $("same").textContent = same ? "形狀一樣" : "形狀不一樣"; $("same").className = "badge" + (same ? " on" : "");
    $("r1").textContent = (dist(B, C) / dist(A, B)).toFixed(4);
    $("r2").textContent = (dist(C, D) / dist(B, C)).toFixed(4);
    $("th").value = Math.round(th * 10);
  }
  function setTh(v){ th = Math.max(5, Math.min(170, Math.round(v * 10) / 10)); clearStat(); draw(); }
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  $("th").addEventListener("input", () => setTh($("th").value / 10));
  $("dn").addEventListener("click", () => setTh(th - 0.1));
  $("up").addEventListener("click", () => setTh(th + 0.1));
  svg.addEventListener("keydown", (ev) => { if (ev.key === "ArrowLeft"){ ev.preventDefault(); setTh(th - 0.1); } if (ev.key === "ArrowRight"){ ev.preventDefault(); setTh(th + 0.1); } });
  $("home").addEventListener("click", () => { if (scanning) return; depth = 0; showEq = false; sync(); setTh(36); });
  function sync(){ $("again").setAttribute("aria-pressed", String(depth > 0)); $("eqs").setAttribute("aria-pressed", String(showEq)); }
  $("again").addEventListener("click", () => { depth = depth ? 0 : 1; sync(); draw(); });
  $("eqs").addEventListener("click", () => { showEq = !showEq; sync(); draw(); });

  $("scan").addEventListener("click", () => {
    if (scanning) return; scanning = true; $("scan").disabled = true; clearStat();
    const found = [], reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let v = 5;
    function tick(){
      const stop = reduce ? 170 : Math.min(170, v + 3);
      for (; v <= stop + 1e-9; v = Math.round((v + 0.1) * 10) / 10){ if (sameShape(v)) found.push(v); }
      th = Math.min(170, stop); draw();
      $("stat").innerHTML = `掃到 ${f1(th)}°`;
      if (v <= 170) requestAnimationFrame(tick);
      else { scanning = false; $("scan").disabled = false;
        $("stat").innerHTML = `每 0.1° 檢查一次，從 5° 到 170°，形狀一樣的只有：<b>${found.map(f1).join("°、")}°</b>`;
        th = found[0] || th; draw(); $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>

</body></html>
